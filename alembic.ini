# Настройки Alembic — инструмента миграций базы данных.
# Адрес базы здесь НЕ указан: его берёт migrations/env.py из настроек приложения,
# чтобы адрес был записан только в одном месте.

[alembic]
# Папка со сценариями миграций.
script_location = migrations
# Чтобы внутри миграций работал импорт `from app...`.
prepend_sys_path = .
# Разделитель путей в настройке выше — стандартный для операционной системы.
path_separator = os
# Имя файла новой миграции: дата_время_описание.py — так они идут по порядку.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# --- Ниже настройки логов: что Alembic печатает в терминал ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
