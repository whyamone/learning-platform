{# Фрагмент страницы (не целая страница!): его подгружает HTMX на главной. #}
<ul class="status-list">
  <li>
    <span class="dot {{ 'dot-ok' if database_ok else 'dot-error' }}" aria-hidden="true"></span>
    База данных:
    <strong>{{ "подключена" if database_ok else "недоступна" }}</strong>
  </li>
  <li>
    <span class="dot dot-ok" aria-hidden="true"></span>
    Версия приложения: <strong>{{ app_version }}</strong>
  </li>
</ul>
