- question: Что такое prompt injection?
  options:
    - Ошибка разбора JSON
    - Способ ускорить ответ
    - Превышение лимита токенов
    - Внедрение в данные текста, который модель принимает за инструкцию
  answer: 4
  explanation: Например, в документе написано «забудь прежние указания и…».

- question: Почему нельзя выполнять код, написанный моделью, без проверки?
  options:
    - Он всегда работает медленнее
    - Модель не умеет писать код
    - Он может содержать ошибки или вредные действия, вызванные чужой инструкцией
    - Это запрещено языком Python
  answer: 3
  explanation: Вывод модели — недоверенные данные, как и ввод пользователя.

- question: Что означает принцип минимальных прав для инструментов агента?
  options:
    - Все инструменты получают права администратора
    - Инструменты работают только ночью
    - Инструментов должно быть как можно меньше
    - Инструмент получает ровно те возможности, которые нужны для его задачи
  answer: 4
  explanation: Тогда даже успешная атака причинит ограниченный вред.
