- front: Что такое «LLM как судья»?
  back: Способ оценки, при котором ответы проверяет другая модель по чётким критериям.

- front: Как проверить модель-оценщика?
  back: Разметить часть ответов вручную и измерить, как часто оценки модели совпадают с человеческими.

- front: Что такое регрессионный тест?
  back: Проверка, которая после каждого изменения убеждается, что работавшее раньше не сломалось.
