- front: Что такое наблюдаемость?
  back: Возможность понять по журналам, показателям и трассировкам, что происходит внутри работающей системы.

- front: Что такое трассировка?
  back: Запись пути одного запроса через все шаги системы с длительностью каждого.

- front: Что такое latency?
  back: 'Задержка: время от отправки запроса до получения ответа.'
