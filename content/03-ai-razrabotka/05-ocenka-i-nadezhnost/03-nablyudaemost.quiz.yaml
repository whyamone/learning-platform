- question: Что такое трассировка запроса?
  options:
    - Удаление старых журналов
    - Запись всех шагов обработки одного запроса с их длительностью
    - Шифрование запроса
    - Повторная отправка запроса
  answer: 2
  explanation: По трассировке видно, какой шаг был медленным или сбойным.

- question: Что полезно записывать для каждого обращения к модели?
  options:
    - Только текст ошибки
    - Промпт, ответ, число токенов и время выполнения
    - Только имя пользователя
    - Ничего, чтобы не занимать место
  answer: 2
  explanation: Без этих данных невозможно разобрать жалобу на плохой ответ.

- question: Зачем следить за числом токенов?
  options:
    - Чтобы увеличить контекстное окно
    - От него зависят стоимость и скорость ответа
    - От него зависит язык ответа
    - От него зависит цвет интерфейса
  answer: 2
  explanation: Рост расхода токенов часто указывает на раздувшийся контекст.
