- question: Что означает подход «LLM как судья»?
  options:
    - Модель обучает другую модель
    - Модель решает юридические вопросы
    - Модель сама выбирает себе задания
    - Ответы системы оценивает другая модель по заданным критериям
  answer: 4
  explanation: Это позволяет проверять сотни ответов без ручного труда.

- question: Как убедиться, что модели-оценщику можно доверять?
  options:
    - Выбрать самую большую модель
    - Запустить её дважды
    - Спросить у неё самой
    - Сравнить её оценки с ручной разметкой человека
  answer: 4
  explanation: Если согласие с человеком низкое, критерии нужно уточнять.

- question: Что такое регрессия?
  options:
    - Улучшение качества
    - Название метрики
    - Ухудшение того, что раньше работало, после изменения
    - Способ обучения модели
  answer: 3
  explanation: Регрессионные тесты ловят такие ухудшения автоматически.
