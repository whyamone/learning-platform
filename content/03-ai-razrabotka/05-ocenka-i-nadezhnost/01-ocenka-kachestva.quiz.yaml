- question: Зачем нужен проверочный набор данных?
  options:
    - Чтобы измерять качество числом, а не впечатлением
    - Чтобы ускорить ответы
    - Чтобы уменьшить стоимость запросов
    - Чтобы обучать модель
  answer: 1
  explanation: Один и тот же набор прогоняют до и после изменения.

- question: Почему в RAG поиск и ответ оценивают отдельно?
  options:
    - Потому что это два разных приложения
    - Потому что так быстрее
    - Чтобы удвоить число метрик
    - Чтобы понять, на каком шаге происходит сбой
  answer: 4
  explanation: Причина плохого ответа может быть в ненайденном фрагменте или в самой генерации.

- question: Что такое эталонный ответ?
  options:
    - Заранее известный правильный ответ, с которым сравнивают ответ системы
    - Самый длинный ответ модели
    - Ответ, который понравился пользователю
    - Первый ответ модели
  answer: 1
  explanation: Его готовит человек, знающий предметную область.
