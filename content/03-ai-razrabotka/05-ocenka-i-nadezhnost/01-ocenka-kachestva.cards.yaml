- front: Что такое eval?
  back: 'Оценка качества: система прогоняется на наборе примеров с известными ответами, и считается доля верных.'

- front: Что такое baseline?
  back: Исходный уровень качества, с которым сравнивают все последующие изменения.

- front: Почему нельзя оценивать изменение по одному примеру?
  back: Модель отвечает по-разному, и один пример ничего не говорит о качестве в целом.
