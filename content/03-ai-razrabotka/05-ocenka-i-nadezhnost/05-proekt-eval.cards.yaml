- front: Из чего состоит система оценки?
  back: Набор вопросов с эталонами, запуск системы на нём, метрики, модель-оценщик и итоговый отчёт.

- front: Как правильно сравнивать варианты системы?
  back: Менять одну вещь за раз и прогонять один и тот же проверочный набор.

- front: Что должно быть в отчёте об оценке?
  back: Таблица метрик по вариантам, вывод о лучшем и разбор типичных ошибок.
