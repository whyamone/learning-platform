- front: Что такое prompt injection?
  back: Атака, при которой в данные — документ, веб-страницу, письмо — вставляют текст, воспринимаемый моделью как инструкция.

- front: Как относиться к выводу модели с точки зрения безопасности?
  back: 'Как к недоверенным данным: проверять перед использованием и не выполнять как код без контроля.'

- front: Что такое принцип минимальных прав?
  back: Каждая часть системы получает только те права, которые нужны для её задачи.
