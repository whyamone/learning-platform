- question: Что показывает работодателю проект с системой оценки?
  options:
    - Что у тебя мощный компьютер
    - Что ты быстро печатаешь
    - Что ты умеешь измерять качество и принимать решения на данных
    - Что ты знаешь много библиотек
  answer: 3
  explanation: Умение доказать качество ценится не меньше умения собрать систему.

- question: Что должно получаться на выходе системы оценки?
  options:
    - Новая обученная модель
    - Архив с исходным кодом
    - Отчёт с метриками по каждому варианту системы
    - Список всех вопросов без результатов
  answer: 3
  explanation: По отчёту видно, какой вариант лучше и насколько.

- question: Как выяснить вклад одной части системы в качество?
  options:
    - Увеличить проверочный набор вдвое
    - Изменить только её и сравнить результаты на том же наборе
    - Изменить всё сразу
    - Спросить у модели
  answer: 2
  explanation: Если поменять несколько вещей разом, непонятно, что именно помогло.
