- front: Что такое агент?
  back: Программа, в которой модель в цикле сама выбирает действия — вызовы инструментов — для достижения цели.

- front: Когда агент не нужен?
  back: 'Когда шаги известны заранее: тогда надёжнее и дешевле обычная цепочка вызовов.'

- front: Какие ограничения нужны агенту?
  back: Предел числа шагов, журнал действий, минимальные права инструментов, подтверждение опасных действий.
