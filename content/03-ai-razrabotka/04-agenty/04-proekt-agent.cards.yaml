- front: Из чего состоит агент-помощник?
  back: Модель, набор инструментов, системный промпт с правилами, цикл выполнения, журнал действий и ограничения.

- front: Что такое сценарий проверки агента?
  back: Задача с известным правильным результатом, которую агент должен решить. Набор сценариев прогоняют после каждого изменения.

- front: Что значит «человек в контуре»?
  back: Опасные или необратимые действия агент выполняет только после подтверждения человека.
