- front: Что такое вызов инструментов?
  back: Механизм, при котором модель вместо ответа возвращает запрос вызвать функцию. Программа выполняет её и передаёт результат модели.

- front: Из чего состоит описание инструмента?
  back: Имя, понятное описание назначения и схема аргументов.

- front: Назови шаги цикла работы с инструментом.
  back: Запрос → модель просит вызвать инструмент → программа выполняет → результат возвращается модели → модель отвечает.
