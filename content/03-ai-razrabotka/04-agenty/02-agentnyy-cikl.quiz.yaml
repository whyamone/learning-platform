- question: Чем агент отличается от цепочки заранее заданных шагов?
  options:
    - Ничем
    - Агент сам решает, какие действия и в каком порядке выполнить
    - Агент работает без модели
    - Агент не использует инструменты
  answer: 2
  explanation: В цепочке порядок шагов определён кодом, в агенте — моделью.

- question: Зачем ограничивать число шагов агента?
  options:
    - Чтобы он не зациклился и не израсходовал бюджет
    - Так требует формат JSON
    - Чтобы ответы были короче
    - Чтобы модель работала быстрее
  answer: 1
  explanation: Без предела ошибка в рассуждении может привести к бесконечному циклу.

- question: Как поступать с действиями, которые что-то изменяют или удаляют?
  options:
    - Запрашивать подтверждение человека
    - Выполнять сразу
    - Запретить агенту любые инструменты
    - Выполнять дважды для надёжности
  answer: 1
  explanation: Необратимые действия оставляют под контролем человека.
