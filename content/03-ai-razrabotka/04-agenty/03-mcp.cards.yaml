- front: Что такое MCP?
  back: Model Context Protocol — открытый протокол подключения инструментов и данных к приложениям с языковыми моделями.

- front: Кто такие клиент и сервер в MCP?
  back: Сервер предоставляет инструменты и данные. Клиент — приложение с моделью, которое ими пользуется.

- front: Что может предоставлять MCP-сервер?
  back: Инструменты (функции), ресурсы (данные для чтения) и заготовки промптов.
