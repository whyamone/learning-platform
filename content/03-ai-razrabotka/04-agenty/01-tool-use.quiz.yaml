- question: Кто на самом деле выполняет функцию при вызове инструмента?
  options:
    - Операционная система без участия программы
    - Сервер поставщика модели
    - 'Твоя программа: модель лишь сообщает, какую функцию вызвать и с какими аргументами'
    - Сама модель
  answer: 3
  explanation: Модель порождает текст с запросом на вызов, а исполняет его код приложения.

- question: Как модель узнаёт, какие инструменты ей доступны?
  options:
    - Из поиска в интернете
    - Никак, она угадывает
    - Из своего обучения
    - 'Из описаний, переданных в запросе: имя, назначение и схема аргументов'
  answer: 4
  explanation: От качества описания зависит, правильно ли модель выберет инструмент.

- question: Зачем проверять аргументы, которые модель передала инструменту?
  options:
    - Модель может ошибиться или выполнить вредную инструкцию из текста
    - Чтобы ускорить вызов
    - Чтобы уменьшить число токенов
    - Проверять не нужно
  answer: 1
  explanation: Вывод модели нельзя считать надёжным входом для кода.
