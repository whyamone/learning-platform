- question: Какую задачу решает протокол MCP?
  options:
    - Заменяет языковую модель
    - Ускоряет генерацию текста
    - Даёт единый способ подключать инструменты и данные к разным приложениям с моделями
    - Шифрует переписку с моделью
  answer: 3
  explanation: Инструмент, оформленный как MCP-сервер, работает с любым клиентом, поддерживающим протокол.

- question: Что предоставляет MCP-сервер?
  options:
    - Вычислительные мощности для модели
    - Обучающие данные
    - Веб-интерфейс чата
    - Инструменты, ресурсы и заготовки промптов
  answer: 4
  explanation: Клиент запрашивает у сервера список возможностей и передаёт его модели.

- question: Чем удобен MCP по сравнению с собственным форматом инструментов?
  options:
    - Инструмент пишется один раз и подключается к разным клиентам
    - Он бесплатен, а свой формат платный
    - Он не требует программирования
    - Он работает без модели
  answer: 1
  explanation: Не нужно заново описывать интеграцию для каждого приложения.
