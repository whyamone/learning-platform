- question: Почему агент в знакомой предметной области — сильный проект для портфолио?
  options:
    - Он не требует тестов
    - Ты можешь оценить его ответы и показать понимание настоящих задач
    - Его проще скопировать у других
    - Он не требует документации
  answer: 2
  explanation: Опыт сетевого инженера здесь работает как преимущество.

- question: Как проверять агента?
  options:
    - Никак, агенты непредсказуемы
    - Одним запросом перед показом
    - Только чтением кода
    - На наборе сценариев с известным правильным результатом
  answer: 4
  explanation: Сценарии прогоняют после каждого изменения.

- question: Какие данные использовать в проекте агента для сетевого инженера?
  options:
    - Настоящие конфигурации с работы
    - Выдуманные конфигурации и журналы
    - Рабочие конфигурации с заменёнными паролями
    - Данные коллег
  answer: 2
  explanation: Рабочие данные не покидают контур ни в каком виде.
