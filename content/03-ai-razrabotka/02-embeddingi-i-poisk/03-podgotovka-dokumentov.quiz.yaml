- question: Зачем документы делят на фрагменты?
  options:
    - Чтобы находить и передавать модели только нужные части, а не весь документ
    - Чтобы зашифровать документ
    - Чтобы ускорить загрузку страницы
    - Чтобы документ занимал меньше места на диске
  answer: 1
  explanation: Эмбеддинг длинного документа размывает смысл, а в контекст он может не поместиться.

- question: Для чего нужно перекрытие между фрагментами?
  options:
    - Чтобы увеличить число фрагментов
    - Чтобы удалить повторы
    - Чтобы мысль на границе фрагментов не оказалась разорванной
    - Чтобы фрагменты были одинаковой длины
  answer: 3
  explanation: Конец одного фрагмента повторяется в начале следующего.

- question: Что обязательно сохранять вместе с каждым фрагментом?
  options:
    - Время чтения
    - Источник и место в документе
    - Имя программиста
    - Цвет шрифта
  answer: 2
  explanation: Без этого ответ нельзя снабдить ссылкой и проверить.
