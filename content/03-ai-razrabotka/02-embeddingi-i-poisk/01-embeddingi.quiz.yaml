- question: Что такое эмбеддинг?
  options:
    - Набор чисел, отражающий смысл текста
    - Перевод текста на английский
    - Сжатая копия текста
    - Список ключевых слов
  answer: 1
  explanation: Тексты с близким смыслом получают близкие наборы чисел.

- question: Чем смысловой поиск отличается от поиска по словам?
  options:
    - Он работает только с английским языком
    - Он ищет только точные совпадения
    - Он находит тексты, близкие по смыслу, даже если слова не совпадают
    - Он всегда быстрее
  answer: 3
  explanation: Запрос «не работает порт» найдёт текст про «интерфейс в состоянии down».

- question: Как измеряют близость двух эмбеддингов?
  options:
    - По разнице длины текстов
    - По алфавитному порядку
    - По числу общих букв в текстах
    - Косинусной близостью — по углу между векторами
  answer: 4
  explanation: Чем меньше угол между векторами, тем ближе смысл текстов.
