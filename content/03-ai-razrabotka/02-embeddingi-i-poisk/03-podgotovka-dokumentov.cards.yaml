- front: Что такое чанк?
  back: Фрагмент документа, который отдельно превращается в эмбеддинг и отдельно находится поиском.

- front: Что такое перекрытие фрагментов?
  back: Повтор части текста на границе соседних фрагментов, чтобы не разрывать мысль.

- front: Какие есть способы разбиения документа?
  back: По числу символов, по абзацам, по заголовкам и структуре документа.
