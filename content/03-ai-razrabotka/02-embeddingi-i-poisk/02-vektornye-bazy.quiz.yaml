- question: Для чего нужна векторная база данных?
  options:
    - Для рисования графиков
    - Для хранения эмбеддингов и быстрого поиска ближайших к запросу
    - Для обучения моделей
    - Для хранения паролей
  answer: 2
  explanation: Перебирать миллионы векторов по одному слишком долго, база использует индекс.

- question: Зачем к вектору прикладывают метаданные?
  options:
    - Чтобы ускорить получение эмбеддинга
    - Чтобы отбирать результаты по источнику, дате или разделу
    - Чтобы вектор стал длиннее
    - Чтобы зашифровать текст
  answer: 2
  explanation: Например, искать только в документах определённого раздела.

- question: Что означает «приближённый поиск ближайших соседей»?
  options:
    - 'Поиск очень похожих векторов без полного перебора: немного теряем в точности, сильно выигрываем в скорости'
    - Поиск только среди соседних строк таблицы
    - Поиск со случайным результатом
    - Поиск по первой букве текста
  answer: 1
  explanation: На больших объёмах точный перебор слишком медленный.
