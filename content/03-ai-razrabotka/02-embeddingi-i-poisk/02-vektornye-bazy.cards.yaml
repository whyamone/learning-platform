- front: Что такое векторная база данных?
  back: Хранилище эмбеддингов с индексом для быстрого поиска самых близких к запросу векторов.

- front: Зачем нужны метаданные в векторной базе?
  back: Чтобы отбирать результаты по источнику, дате, разделу и показывать, откуда взят фрагмент.

- front: Назови примеры векторных баз.
  back: Chroma, Qdrant, а также расширение pgvector для PostgreSQL.
