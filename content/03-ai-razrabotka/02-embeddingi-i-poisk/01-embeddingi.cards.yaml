- front: Что такое эмбеддинг?
  back: Числовое представление текста — вектор. Близкие по смыслу тексты дают близкие векторы.

- front: Что такое косинусная близость?
  back: Мера сходства двух векторов по углу между ними. Значение около 1 означает близкий смысл.

- front: Чем модель эмбеддингов отличается от чат-модели?
  back: Модель эмбеддингов превращает текст в вектор и ничего не порождает. Чат-модель порождает текст.
