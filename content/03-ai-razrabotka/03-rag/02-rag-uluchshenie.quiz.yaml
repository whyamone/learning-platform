- question: Что такое гибридный поиск?
  options:
    - Поиск с двумя моделями генерации
    - Поиск на двух языках
    - Сочетание смыслового поиска и поиска по словам
    - Поиск сразу в двух базах данных
  answer: 3
  explanation: Поиск по словам хорошо находит точные названия и номера, смысловой — перефразированные вопросы.

- question: Что делает переранжирование?
  options:
    - Увеличивает размер фрагментов
    - Изменяет вопрос пользователя
    - Удаляет документы из базы
    - Заново сортирует найденные фрагменты более точной моделью
  answer: 4
  explanation: Сначала быстро находят с запасом, затем точно отбирают лучшее.

- question: С чего начинать улучшение RAG?
  options:
    - С увеличения числа документов
    - С переписывания интерфейса
    - 'С разбора ошибок: сбой в поиске или в генерации'
    - С замены модели на самую большую
  answer: 3
  explanation: Если нужный фрагмент не найден, никакой промпт не поможет.
