- question: Что такое RAG?
  options:
    - Формат хранения векторов
    - Язык запросов к базе
    - Подход, при котором модель отвечает с опорой на найденные фрагменты документов
    - Способ дообучения модели
  answer: 3
  explanation: Сначала поиск, затем генерация ответа по найденному.

- question: Какую задачу решает RAG?
  options:
    - Ускоряет генерацию
    - Даёт модели сведения, которых не было в её обучающих данных
    - Заменяет промпт
    - Уменьшает размер модели
  answer: 2
  explanation: Так модель отвечает по внутренним документам и свежим данным.

- question: Как должна поступить система, если в документах нет ответа?
  options:
    - Придумать правдоподобный ответ
    - Повторить вопрос пользователя
    - Вернуть случайный фрагмент
    - Честно сообщить, что ответа в источниках нет
  answer: 4
  explanation: Это прямо указывают в промпте и проверяют на вопросах без ответа.
