- front: Из каких частей состоит ассистент по документации?
  back: Загрузка документов, поиск, генерация ответа с источниками, API, интерфейс, набор проверочных вопросов.

- front: Как показать качество RAG-проекта?
  back: Привести долю верных ответов на наборе проверочных вопросов и сравнение нескольких вариантов системы.

- front: Какие данные можно использовать в проекте для портфолио?
  back: Только открытые или выдуманные. Рабочие документы в публичный репозиторий не попадают.
