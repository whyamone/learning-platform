- front: Что такое фреймворк?
  back: Каркас с готовыми компонентами и правилами их соединения. Берёт на себя типовые части приложения.

- front: В чём плюс и минус фреймворков для LLM?
  back: Плюс — быстрый старт на готовых компонентах. Минус — труднее отлаживать и контролировать детали.

- front: 'Как выбрать: фреймворк или свой код?'
  back: Свой код — когда задача простая или нужен полный контроль. Фреймворк — когда нужны многие готовые интеграции.
