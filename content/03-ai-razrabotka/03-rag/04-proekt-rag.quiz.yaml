- question: Что делает проект убедительным для работодателя?
  options:
    - Работающий запуск, понятный README и измеренное качество
    - Использование самой дорогой модели
    - Большое число файлов
    - Длинный список зависимостей
  answer: 1
  explanation: Важно показать, что система работает и что ты умеешь это доказать.

- question: Зачем проекту набор проверочных вопросов?
  options:
    - Чтобы увеличить размер репозитория
    - Чтобы измерять качество и видеть, улучшают ли его изменения
    - Чтобы заменить документацию
    - Чтобы ускорить запуск
  answer: 2
  explanation: Без измерения нельзя отличить улучшение от ухудшения.

- question: Что должно быть в README такого проекта?
  options:
    - Схема устройства, инструкция запуска, примеры и результаты оценки
    - Только название
    - Список использованных шрифтов
    - Полный текст всех документов
  answer: 1
  explanation: README читают первым, и по нему судят о проекте.
