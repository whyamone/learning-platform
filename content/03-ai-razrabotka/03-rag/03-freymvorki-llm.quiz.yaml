- question: Что дают фреймворки вроде LangChain и LlamaIndex?
  options:
    - Гарантию правильных ответов
    - Бесплатный доступ к платным моделям
    - Собственную языковую модель
    - 'Готовые компоненты для типовых задач: загрузку документов, поиск, цепочки вызовов'
  answer: 4
  explanation: Они экономят время на типовых частях.

- question: Какова цена использования фреймворка?
  options:
    - Нужна отдельная лицензия на каждую функцию
    - Нельзя использовать Python
    - Программа перестаёт работать без интернета
    - Труднее понять и отладить, что именно происходит внутри
  answer: 4
  explanation: Абстракция скрывает детали — в том числе те, что нужны при поиске ошибки.

- question: Почему RAG полезно сначала написать без фреймворка?
  options:
    - Потому что так всегда быстрее
    - Чтобы понимать каждый шаг и уметь разбираться в сбоях
    - Потому что фреймворки запрещены
    - Потому что фреймворки не умеют искать
  answer: 2
  explanation: Понимая устройство, легче выбрать инструмент осознанно.
