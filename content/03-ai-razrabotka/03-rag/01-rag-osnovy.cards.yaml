- front: Что такое RAG?
  back: 'Retrieval-augmented generation: система находит подходящие фрагменты документов и передаёт их модели вместе с вопросом.'

- front: Назови шаги базового RAG.
  back: Загрузка документов → разбиение → эмбеддинги → векторная база → поиск по вопросу → промпт с фрагментами → ответ со ссылками.

- front: Зачем в ответе RAG нужны ссылки на источники?
  back: Чтобы ответ можно было проверить и чтобы было видно, на что он опирается.
