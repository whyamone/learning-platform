- front: Что такое гибридный поиск?
  back: Объединение смыслового поиска по эмбеддингам и классического поиска по словам, например BM25.

- front: Что такое переранжирование?
  back: 'Второй шаг поиска: найденные с запасом фрагменты заново сортирует более точная, но медленная модель.'

- front: Чем полнота отличается от точности поиска?
  back: Полнота — какая доля нужного найдена. Точность — какая доля найденного действительно нужна.
