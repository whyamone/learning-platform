- front: Что такое токен?
  back: 'Кусочек текста, которым оперирует модель: слово, часть слова или знак. В токенах измеряют длину запроса и ответа.'

- front: Что такое галлюцинация модели?
  back: 'Уверенно выданный неверный ответ: модель порождает правдоподобный текст, а не проверяет факты.'

- front: Что такое температура?
  back: 'Параметр случайности: чем выше, тем разнообразнее ответы. Для точных задач её ставят близкой к нулю.'
