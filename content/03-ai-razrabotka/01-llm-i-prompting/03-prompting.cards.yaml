- front: Из чего состоит хороший промпт?
  back: Роль, контекст, чёткая задача, требования к формату ответа и при необходимости примеры.

- front: Что такое few-shot?
  back: Несколько примеров «вход — ответ» прямо в промпте. Запрос без примеров называют zero-shot.

- front: Как уменьшить число выдумок модели?
  back: Дать нужные сведения в контексте, разрешить отвечать «не знаю», просить ссылаться на источник.
