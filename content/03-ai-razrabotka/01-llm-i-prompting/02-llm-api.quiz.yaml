- question: Какие роли сообщений есть в формате чата?
  options:
    - question и answer
    - admin, guest и bot
    - system, user и assistant
    - input, output и error
  answer: 3
  explanation: system задаёт правила, user — сообщения человека, assistant — ответы модели.

- question: Как модель «помнит» предыдущие реплики диалога?
  options:
    - Модель хранит диалоги на своём сервере
    - Программа каждый раз отправляет ей всю историю сообщений
    - Модель запоминает пользователя по адресу
    - Никак, вести диалог с моделью невозможно
  answer: 2
  explanation: 'API не хранит состояние: каждый запрос независим.'

- question: Что ограничивает параметр max_tokens?
  options:
    - Число запросов в минуту
    - Размер контекстного окна
    - Длину запроса пользователя
    - Наибольшую длину ответа модели
  answer: 4
  explanation: Если ответ упирается в этот предел, он обрывается на полуслове.
