- front: Что такое стриминг?
  back: 'Потоковая выдача: ответ модели приходит частями по мере генерации.'

- front: Что такое backoff?
  back: 'Нарастающая пауза между повторными попытками: например 1, 2, 4, 8 секунд.'

- front: Что стоит записывать для каждого запроса к модели?
  back: Число токенов запроса и ответа, время ответа, использованную модель и признак ошибки.
