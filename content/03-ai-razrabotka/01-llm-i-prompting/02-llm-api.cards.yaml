- front: Назови три роли сообщений в чате с моделью.
  back: '`system` — инструкция и роль, `user` — сообщения пользователя, `assistant` — ответы модели.'

- front: Что значит «API не хранит состояние»?
  back: Модель не помнит прошлые запросы. Чтобы вести диалог, программа сама отправляет всю историю в каждом запросе.

- front: Что такое OpenAI-совместимый API?
  back: Интерфейс с тем же форматом запросов, что у OpenAI. Его поддерживают многие сервисы и локальные серверы, поэтому код легко переносится.
