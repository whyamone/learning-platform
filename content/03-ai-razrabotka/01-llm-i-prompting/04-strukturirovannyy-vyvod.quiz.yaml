- question: Зачем нужен структурированный вывод?
  options:
    - Чтобы ответ был красивее
    - Чтобы модель отвечала по-русски
    - Чтобы ответ модели можно было надёжно разобрать программой
    - Чтобы уменьшить число токенов
  answer: 3
  explanation: Свободный текст трудно обрабатывать кодом, а JSON по схеме — легко.

- question: Что делать, если модель вернула некорректный JSON?
  options:
    - Ничего, такого не бывает
    - Исправить JSON вручную в коде на глаз
    - Перехватить ошибку разбора и повторить запрос или сообщить о сбое
    - Считать ответ пустым и продолжать работу
  answer: 3
  explanation: Вывод модели нельзя считать надёжным — его всегда проверяют.

- question: Чем удобен Pydantic при работе с ответами модели?
  options:
    - Он уменьшает стоимость запроса
    - Он проверяет, что ответ соответствует схеме, и превращает его в объект
    - Он ускоряет модель
    - Он переводит ответ на русский
  answer: 2
  explanation: Одно описание модели данных служит и схемой, и проверкой.
