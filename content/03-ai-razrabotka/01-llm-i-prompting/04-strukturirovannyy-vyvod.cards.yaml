- front: Что такое структурированный вывод?
  back: Ответ модели в строгом формате, обычно JSON по заданной схеме, который можно разобрать программой.

- front: Почему ответ модели нужно проверять?
  back: Модель может нарушить формат, пропустить поле или выдумать значение. Проверка схемой ловит это до того, как данные пойдут дальше.

- front: Что делать при нарушении формата?
  back: Повторить запрос — иногда с текстом ошибки в подсказке — и ограничить число попыток.
