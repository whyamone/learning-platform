- question: Что делает языковая модель при генерации текста?
  options:
    - Выполняет программу, написанную разработчиками для каждого вопроса
    - Ищет готовый ответ в базе данных
    - Раз за разом предсказывает следующий токен на основе предыдущих
    - Копирует текст из интернета
  answer: 3
  explanation: Ответ строится по одному токену, и каждый новый токен зависит от всех предыдущих.

- question: Что такое контекстное окно?
  options:
    - Время, за которое модель отвечает
    - Количество пользователей, работающих одновременно
    - Наибольший объём текста, который модель может учесть за один запрос
    - Окно программы, в котором идёт диалог
  answer: 3
  explanation: Всё, что не поместилось в контекстное окно, модель не видит.

- question: Что происходит при повышении температуры?
  options:
    - Увеличивается контекстное окно
    - Модель становится точнее
    - Модель отвечает быстрее
    - Ответы становятся разнообразнее и менее предсказуемыми
  answer: 4
  explanation: При температуре 0 модель почти всегда выбирает самый вероятный токен.
