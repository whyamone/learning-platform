- question: Что такое few-shot?
  options:
    - Ограничение длины ответа
    - Приём, при котором в промпт добавляют несколько примеров «вход — ожидаемый ответ»
    - Способ ускорить модель
    - Запрос без каких-либо инструкций
  answer: 2
  explanation: Примеры показывают модели формат и стиль ответа лучше, чем описание словами.

- question: Зачем отделять инструкцию от данных в промпте?
  options:
    - Так требует формат JSON
    - Чтобы промпт стал короче
    - Чтобы модель не приняла текст данных за указания
    - Чтобы ответ пришёл быстрее
  answer: 3
  explanation: Данные оборачивают в теги или иные разделители.

- question: Как надёжно сравнить два варианта промпта?
  options:
    - Спросить у модели, какой промпт лучше
    - Прогнать оба на одном наборе примеров с известными ответами
    - Задать по одному вопросу и выбрать ответ, который больше понравился
    - Выбрать более длинный промпт
  answer: 2
  explanation: 'Впечатление от одного ответа обманчиво: модель отвечает по-разному.'
