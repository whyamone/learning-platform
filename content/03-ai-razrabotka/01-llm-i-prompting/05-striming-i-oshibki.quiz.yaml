- question: Что даёт потоковая выдача ответа?
  options:
    - Текст появляется по мере генерации, и пользователь не ждёт ответ целиком
    - Ответ становится точнее
    - Запрос стоит дешевле
    - Увеличивается контекстное окно
  answer: 1
  explanation: Общее время генерации то же, но первые слова видны почти сразу.

- question: Как правильно повторять запрос после сбоя?
  options:
    - С нарастающей паузой и ограниченным числом попыток
    - Никогда не повторять
    - Немедленно и бесконечно, пока не получится
    - Отправить десять запросов одновременно
  answer: 1
  explanation: Мгновенные повторы только усиливают нагрузку на перегруженный сервер.

- question: От чего зависит стоимость запроса к платной модели?
  options:
    - От скорости интернета
    - От числа токенов запроса и ответа
    - От времени суток
    - От числа слов в системном промпте, и только от него
  answer: 2
  explanation: Поэтому расход токенов записывают для каждого запроса.
