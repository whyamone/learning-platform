- question: Что такое pull request?
  options:
    - Предложение влить одну ветку в другую с возможностью обсудить изменения
    - Сообщение об ошибке в программе
    - Запрос на удаление ветки
    - Команда для скачивания репозитория
  answer: 1
  explanation: В командах изменения попадают в основную ветку только через pull request.

- question: Что должно быть в README проекта в первую очередь?
  options:
    - Полный исходный код
    - Список всех коммитов
    - Что делает программа и как её запустить
    - Биография автора
  answer: 3
  explanation: README — первое и часто единственное, что читает человек, открывший репозиторий.

- question: 'Что произойдёт, если написать в описании pull request «Closes #3»?'
  options:
    - Pull request закроется через три дня
    - Будут удалены три коммита
    - При слиянии задача номер 3 закроется автоматически
    - Ничего
  answer: 3
  explanation: Так GitHub связывает изменения с задачами.

- question: Какой pull request проверят внимательнее?
  options:
    - Большой, со всеми изменениями за месяц
    - Небольшой, решающий одну задачу
    - Без описания
    - С одним коммитом на тысячу строк
  answer: 2
  explanation: Маленькие изменения легче понять, поэтому в них реже пропускают ошибки.
