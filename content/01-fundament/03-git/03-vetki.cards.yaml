- front: Что такое ветка?
  back: Указатель на коммит. Отдельная линия разработки, которая не затрагивает основную.

- front: Назови порядок работы с веткой.
  back: Создать ветку под задачу → сделать коммиты → вернуться в `main` → слить → удалить ветку.

- front: Как разрешить конфликт слияния?
  back: Открыть файл, оставить правильный вариант, удалить метки `<<<<<<<`, `=======`, `>>>>>>>`, выполнить `git add` и `git commit`.

- front: Что такое слияние fast-forward?
  back: 'Слияние без нового коммита: в основной ветке ничего не менялось, и Git просто передвигает её указатель вперёд.'
