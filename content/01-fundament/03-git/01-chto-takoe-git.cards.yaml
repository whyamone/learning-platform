- front: Что такое репозиторий?
  back: Папка проекта вместе с историей изменений, которая хранится в скрытой папке `.git`.

- front: Назови три состояния файла в Git.
  back: Изменён (в рабочей папке), подготовлен (в индексе после `git add`), сохранён (в истории после `git commit`).

- front: Назови основной цикл команд Git.
  back: '`git status` → `git add` → `git commit -m "сообщение"`.'

- front: Каким должен быть хороший коммит?
  back: Одно логическое изменение с сообщением, по которому понятно, что сделано.
