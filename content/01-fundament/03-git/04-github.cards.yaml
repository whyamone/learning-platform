- front: Чем `git fetch` отличается от `git pull`?
  back: '`fetch` только скачивает новые коммиты. `pull` скачивает и сразу вливает их в текущую ветку.'

- front: Что делает `git clone`?
  back: Скачивает репозиторий целиком вместе с историей и настраивает `origin`.

- front: Почему нельзя использовать `git push --force` в общих ветках?
  back: Он перезаписывает историю на сервере и может уничтожить чужие коммиты.

- front: Что не должно попадать на GitHub?
  back: Пароли, ключи, файлы `.env` и рабочие данные с реальными адресами и именами.
