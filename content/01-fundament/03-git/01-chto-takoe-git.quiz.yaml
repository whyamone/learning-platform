- question: Что такое коммит?
  options:
    - Команда для отправки кода на сервер
    - Копия проекта на другом компьютере
    - Файл с настройками Git
    - Сохранённый снимок состояния проекта
  answer: 4
  explanation: У коммита есть автор, дата, сообщение и уникальный идентификатор.

- question: Что делает команда git add?
  options:
    - Помещает изменения в индекс — список того, что войдёт в следующий коммит
    - Отправляет изменения на GitHub
    - Сохраняет изменения в историю
    - Создаёт новый репозиторий
  answer: 1
  explanation: 'Изменение проходит три шага: рабочая папка → индекс → история.'

- question: Какая команда показывает, что изменилось в рабочей папке?
  options:
    - git status
    - git log
    - git init
    - git commit
  answer: 1
  explanation: 'git status — самая частая команда: она подсказывает, что происходит и что делать дальше.'

- question: Какое сообщение коммита лучше?
  options:
    - Обновление
    - Разные правки
    - Добавить проверку формата IP-адреса
    - fix
  answer: 3
  explanation: Сообщение должно отвечать на вопрос, что делает этот коммит.
