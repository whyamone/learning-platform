- question: Чем Git отличается от GitHub?
  options:
    - Git — программа на твоём компьютере, GitHub — сайт для хранения репозиториев
    - Ничем, это два названия одного и того же
    - GitHub — новая версия Git
    - Git работает только вместе с GitHub
  answer: 1
  explanation: Git работает и без GitHub. Существуют и другие сервисы, например GitLab.

- question: Что делает git pull?
  options:
    - Скачивает новые коммиты с сервера и вливает их в текущую ветку
    - Удаляет локальные изменения
    - Создаёт копию репозитория
    - Отправляет коммиты на сервер
  answer: 1
  explanation: git pull — это git fetch и сразу git merge.

- question: Сервер отклонил git push с сообщением «fetch first». Что делать?
  options:
    - Выполнить git pull, затем повторить git push
    - Выполнить git push --force
    - Удалить репозиторий и создать заново
    - Подождать несколько минут
  answer: 1
  explanation: На сервере есть коммиты, которых нет у тебя. --force уничтожил бы чужую работу.

- question: Что означает имя origin?
  options:
    - Имя владельца репозитория
    - Имя главной ветки
    - Принятое имя основного удалённого репозитория
    - Имя первого коммита
  answer: 3
  explanation: Его задают командой git remote add origin адрес.
