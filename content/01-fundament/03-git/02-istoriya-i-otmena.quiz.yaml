- question: Что показывает git diff --staged?
  options:
    - Список всех коммитов
    - Изменения в рабочей папке, ещё не добавленные в индекс
    - Изменения, добавленные в индекс и готовые к коммиту
    - Разницу между двумя ветками
  answer: 3
  explanation: Без --staged команда показывает то, что ещё не добавлено в индекс.

- question: Чем git revert отличается от git reset?
  options:
    - revert создаёт новый коммит с обратными изменениями, reset убирает коммиты из истории
    - Ничем
    - reset создаёт новый коммит, revert убирает коммиты
    - revert работает только с последним коммитом
  answer: 1
  explanation: Коммиты, уже отправленные на сервер, отменяют через revert — история остаётся целой.

- question: Какая команда вернёт файл к состоянию последнего коммита?
  options:
    - git log файл
    - git add файл
    - git restore файл
    - git commit файл
  answer: 3
  explanation: Несохранённые изменения в файле при этом пропадут безвозвратно.

- question: Зачем нужен файл .gitignore?
  options:
    - Чтобы хранить пароли
    - Чтобы ускорить работу Git
    - Чтобы Git не замечал указанные файлы и папки
    - Чтобы описать проект для других людей
  answer: 3
  explanation: В него записывают виртуальные окружения, служебные папки, файлы с секретами.
