- front: Что такое pull request?
  back: Предложение влить ветку в основную. В нём видны изменения, идёт обсуждение и запускаются проверки.

- front: Что писать в описании pull request?
  back: Что сделано, зачем это нужно и как проверить.

- front: Что должно быть в README?
  back: Название и суть проекта, возможности, установка и запуск, пример использования.

- front: Что такое code review?
  back: Проверка кода другим человеком перед слиянием. Свой код тоже полезно просмотреть во вкладке Files changed.
