- question: Что такое ветка в Git?
  options:
    - Указатель на коммит
    - Отдельный репозиторий
    - Архив старых версий
    - Полная копия всех файлов проекта
  answer: 1
  explanation: Поэтому ветки создаются мгновенно и почти не занимают места.

- question: Какой командой создать ветку и сразу перейти в неё?
  options:
    - git branch -d имя
    - git switch -c имя
    - git add имя
    - git merge имя
  answer: 2
  explanation: В старых руководствах то же самое записано как git checkout -b имя.

- question: Когда возникает конфликт слияния?
  options:
    - Когда в обеих ветках по-разному изменена одна и та же строка
    - Когда в ветках разное количество коммитов
    - Когда ветка создана слишком давно
    - Когда у веток разные имена
  answer: 1
  explanation: Git не знает, какой вариант правильный, и просит выбрать вручную.

- question: Как отменить начатое слияние с конфликтом?
  options:
    - Удалить папку .git
    - git branch -d main
    - git merge --abort
    - git reset --hard HEAD~5
  answer: 3
  explanation: Команда возвращает ветку в состояние до начала слияния.
