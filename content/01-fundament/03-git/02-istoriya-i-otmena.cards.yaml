- front: Что показывает `git diff`?
  back: Изменения в рабочей папке, которые ещё не добавлены в индекс. С `--staged` — те, что уже в индексе.

- front: Как исправить сообщение последнего коммита?
  back: '`git commit --amend -m "новое сообщение"`'

- front: Чем `git revert` отличается от `git reset`?
  back: '`revert` создаёт новый коммит с обратными изменениями и безопасен всегда. `reset` передвигает ветку назад и убирает коммиты.'

- front: Что делать, если пароль попал в коммит?
  back: Считать его раскрытым и сменить. Удаление файла не убирает пароль из истории.
