- question: С чего лучше начать работу над проектом?
  options:
    - С оформления README
    - С самой простой работающей версии, к которой возможности добавляются по одной
    - С выбора цветовой схемы вывода
    - С написания всего кода целиком перед первым запуском
  answer: 2
  explanation: После каждого шага программа должна работать — так ошибки находятся сразу.

- question: Почему функции расчёта должны возвращать данные, а не печатать их?
  options:
    - Так требует модуль argparse
    - Так программа работает быстрее
    - print() нельзя вызывать внутри функций
    - Один и тот же результат можно и вывести на экран, и сохранить в JSON
  answer: 4
  explanation: Вывод и расчёт разделяют, чтобы результат можно было использовать по-разному.

- question: Какие данные можно использовать в учебном проекте на GitHub?
  options:
    - Настоящие журналы с рабочего оборудования
    - Конфигурации с работы, если убрать пароли
    - Только выдуманные
    - Любые, если репозиторий небольшой
  answer: 3
  explanation: Рабочие данные не должны покидать контур, даже без паролей.
