- front: Что делает модуль `argparse`?
  back: Разбирает аргументы командной строки и сам создаёт справку `--help`.

- front: Как разбить работу над проектом?
  back: Начать с простейшей работающей версии и добавлять по одной возможности. Каждая возможность — отдельная ветка и pull request.

- front: Что делать, когда застрял?
  back: Сформулировать проблему вслух, уменьшить пример, прочитать ошибку целиком, сделать перерыв, и только потом спрашивать.
