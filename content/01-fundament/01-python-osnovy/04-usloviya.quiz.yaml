- question: Чем = отличается от ==?
  options:
    - Первый сравнивает, второй присваивает
    - Первый присваивает значение, второй сравнивает
    - Ничем, это одно и то же
    - == используется только для строк
  answer: 2
  explanation: x = 5 записывает 5 в x. x == 5 спрашивает, равен ли x пяти.

- question: 'load = 95. Какая ветка выполнится: if load >= 40 … elif load >= 90 … else …?'
  options:
    - Первая — if load >= 40
    - Вторая — elif load >= 90
    - Обе по очереди
    - Ветка else
  answer: 1
  explanation: Условия проверяются сверху вниз, выполняется первая подходящая ветка. Остальные пропускаются.

- question: Когда выражение a and b истинно?
  options:
    - Когда истинны оба условия
    - Всегда
    - Когда оба ложны
    - Когда истинно хотя бы одно
  answer: 1
  explanation: and требует истинности обоих условий, or — хотя бы одного.

- question: Как Python понимает, какие строки относятся к блоку if?
  options:
    - По фигурным скобкам
    - По отступу в начале строки
    - По пустой строке после блока
    - По точке с запятой
  answer: 2
  explanation: Отступы в Python — часть синтаксиса. Принято четыре пробела.

- question: Какое из значений считается ложным в условии?
  options:
    - Пустая строка ""
    - Число -1
    - Строка "0"
    - Строка "False"
  answer: 1
  explanation: Ложными считаются 0, пустая строка, None и пустые коллекции. Любая непустая строка истинна.
