- front: С какого числа начинается нумерация символов в строке?
  back: С нуля. Последний символ можно получить индексом `-1`.

- front: Что означает «строки неизменяемы»?
  back: 'Изменить символ внутри строки нельзя. Методы возвращают новую строку, поэтому результат присваивают: `name = name.upper()`.'

- front: Что делают `split()` и `join()`?
  back: '`split()` разбивает строку на список частей. `join()` склеивает список строк в одну: `".".join(parts)`.'

- front: Как убрать пробелы по краям строки?
  back: Методом `strip()`.

- front: Как проверить, есть ли подстрока в строке?
  back: 'Оператором `in`: `"down" in log_line` вернёт `True` или `False`.'
