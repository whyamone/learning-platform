- question: Какой тип возвращает функция input()?
  options:
    - int, если введены цифры
    - float
    - Всегда str
    - Тот, который указан в скобках
  answer: 3
  explanation: input() всегда возвращает строку, даже если пользователь набрал цифры.

- question: Пользователь ввёл 24. Что выведет print(input() * 2)?
  options:
    - '48'
    - '2424'
    - Ошибку
    - 24 24
  answer: 2
  explanation: Введённое значение — строка "24". Строка, умноженная на 2, повторяется дважды.

- question: Чему равно int(3.9)?
  options:
    - '3.9'
    - '4'
    - Ошибка
    - '3'
  answer: 4
  explanation: int() отбрасывает дробную часть, а не округляет. Для округления есть round().

- question: Что выведет print(f"{73.4567:.1f}")?
  options:
    - '73.5'
    - '73.4'
    - '73'
    - '73.4567'
  answer: 1
  explanation: Формат .1f оставляет один знак после точки и округляет.

- question: Какая ошибка возникнет при int("abc")?
  options:
    - SyntaxError
    - TypeError
    - ValueError
    - NameError
  answer: 3
  explanation: Тип аргумента подходит (строка), но её значение нельзя превратить в число — это ValueError.
