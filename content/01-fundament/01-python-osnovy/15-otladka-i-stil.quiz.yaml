- question: Что такое логическая ошибка?
  options:
    - Ошибка при установке библиотеки
    - Ошибка из-за отсутствующего файла
    - Программа работает без сообщений об ошибках, но выдаёт неверный результат
    - Ошибка в записи кода, которую Python находит до запуска
  answer: 3
  explanation: 'Логические ошибки труднее всего искать: о них никто не сообщает.'

- question: Что выведет print(f"{total=}"), если total равно 30?
  options:
    - total=30
    - total
    - '30'
    - '{total=}'
  answer: 1
  explanation: Знак = внутри фигурных скобок печатает и имя, и значение — удобно для отладки.

- question: Что делает вызов breakpoint()?
  options:
    - Удаляет отладочные сообщения
    - Завершает программу
    - Пропускает следующую строку
    - Останавливает программу и открывает отладчик
  answer: 4
  explanation: В отладчике можно смотреть переменные и выполнять программу по шагам.

- question: Какой стиль имён принят для переменных и функций в Python?
  options:
    - kebab-case
    - CamelCase
    - snake_case
    - UPPER_CASE
  answer: 3
  explanation: CamelCase используют для классов, UPPER_CASE — для констант.

- question: Что должен объяснять комментарий в коде?
  options:
    - Почему код написан именно так
    - Что делает каждая строка
    - На каком языке написана программа
    - Кто и когда написал код
  answer: 1
  explanation: Что делает код, должно быть видно из самого кода и имён переменных.
