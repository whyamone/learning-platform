- front: Назови порядок поиска ошибки.
  back: Воспроизвести; уменьшить пример; сформулировать ожидание; сузить место; исправить и проверить.

- front: Что такое PEP 8?
  back: 'Общепринятое руководство по стилю кода на Python: отступы, имена, пробелы, длина строк.'

- front: Что делают линтер и форматтер?
  back: Линтер находит ошибки и нарушения стиля. Форматтер сам переписывает код в принятом виде.

- front: Какими командами проверить и отформатировать код через `ruff`?
  back: '`ruff check .` — найти проблемы, `ruff format .` — привести оформление к единому виду.'

- front: Что такое «метод утёнка»?
  back: Объяснить свой код вслух строку за строкой. Ошибка часто находится прямо во время объяснения.
