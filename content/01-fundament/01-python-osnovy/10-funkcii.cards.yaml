- front: Как объявить функцию?
  back: '`def имя(параметры):`, ниже с отступом — тело функции.'

- front: Что делает `return`?
  back: Завершает функцию и возвращает значение туда, откуда её вызвали.

- front: Что такое область видимости?
  back: Часть программы, где переменная доступна. Переменные, созданные внутри функции, снаружи не видны.

- front: Назови признаки хорошей функции.
  back: Делает одно дело; имя начинается с глагола; получает данные через параметры и возвращает результат, а не печатает его.

- front: Что такое `lambda`?
  back: 'Короткая безымянная функция: `lambda device: device["ports"]`.'
