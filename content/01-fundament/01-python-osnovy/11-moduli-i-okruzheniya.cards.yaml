- front: Что такое модуль?
  back: Файл с кодом на Python (`.py`), который можно подключить через `import`.

- front: Как активировать виртуальное окружение?
  back: '`source .venv/bin/activate`. В начале приглашения появится `(.venv)`.'

- front: Зачем нужен `requirements.txt`?
  back: В нём записан список библиотек проекта с версиями. По нему окружение восстанавливается командой `pip install -r requirements.txt`.

- front: Что делать при `ModuleNotFoundError`?
  back: Проверить, активировано ли окружение — есть ли `(.venv)` в приглашении, — и установлена ли библиотека.

- front: Зачем нужна строка `if __name__ == "__main__":`?
  back: Код под ней выполняется только при прямом запуске файла и не срабатывает при импорте.
