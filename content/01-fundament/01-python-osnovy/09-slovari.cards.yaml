- front: Что такое словарь?
  back: 'Набор пар «ключ — значение». Значение находят по ключу: `device["hostname"]`.'

- front: Чем `d["key"]` отличается от `d.get("key")`?
  back: Если ключа нет, первое вызывает `KeyError`, а `get()` возвращает `None` или значение по умолчанию.

- front: Как добавить пару в словарь?
  back: 'Присвоить по новому ключу: `device["location"] = "стойка 3"`.'

- front: Как посчитать, сколько раз встречается каждое значение?
  back: '`counts[x] = counts.get(x, 0) + 1` в цикле по элементам.'

- front: Что может быть ключом словаря?
  back: 'Только неизменяемое значение: строка, число, кортеж. Список ключом быть не может.'
