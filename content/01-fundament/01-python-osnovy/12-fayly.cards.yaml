- front: Какие три режима открытия файла используются чаще всего?
  back: '`"r"` — чтение, `"w"` — запись со стиранием прежнего содержимого, `"a"` — дозапись в конец.'

- front: Как прочитать файл построчно?
  back: '`with open(path, encoding="utf-8") as file:`, затем `for line in file:`.'

- front: Зачем вызывать `strip()` у строки, прочитанной из файла?
  back: Каждая строка заканчивается символом перевода строки `\n`, и `strip()` его убирает.

- front: Как проверить, что файл существует?
  back: '`Path(path).exists()`'

- front: Что такое `pathlib`?
  back: 'Модуль стандартной библиотеки для работы с путями. Пути собираются оператором `/`: `Path.home() / "study"`.'
