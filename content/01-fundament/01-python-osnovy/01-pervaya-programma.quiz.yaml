- question: Что делает интерпретатор Python?
  options:
    - Проверяет орфографию в комментариях
    - Читает код строку за строкой и выполняет его
    - Сохраняет файлы на диск
    - Превращает программу в картинку
  answer: 2
  explanation: Интерпретатор — программа-посредник между текстом кода и компьютером.

- question: Какой командой в Ubuntu запустить файл hello.py?
  options:
    - run hello.py
    - python3 hello.py
    - hello.py start
    - python hello
  answer: 2
  explanation: В Ubuntu интерпретатор вызывается командой python3, после неё указывается имя файла.

- question: Что выведет print("2 + 3")?
  options:
    - Ошибку
    - 2 + 3
    - '23'
    - '5'
  answer: 2
  explanation: В кавычках записана строка. Она выводится как есть и не вычисляется.

- question: 'Как Python поступает с текстом после символа #?'
  options:
    - Считает ошибкой
    - Выполняет в первую очередь
    - Выводит на экран
    - Пропускает его — это комментарий
  answer: 4
  explanation: Комментарий — заметка для человека, интерпретатор его игнорирует.

- question: Программа упала с SyntaxError. Что это значит?
  options:
    - Не хватило памяти компьютера
    - Нарушены правила записи кода, например не закрыта кавычка
    - Файл не найден
    - Деление на ноль
  answer: 2
  explanation: SyntaxError — ошибка синтаксиса. Python находит её ещё до запуска программы.
