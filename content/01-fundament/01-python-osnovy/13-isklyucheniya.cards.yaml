- front: Что такое исключение?
  back: 'Ошибка во время выполнения программы: код записан верно, но что-то пошло не так.'

- front: Как перехватить исключение?
  back: Поместить опасный код в `try:`, а реакцию на ошибку — в `except ТипОшибки:`.

- front: Чем `ValueError` отличается от `TypeError`?
  back: '`ValueError` — тип подходит, значение нет: `int("abc")`. `TypeError` — не подходит сам тип: `"a" + 1`.'

- front: Почему нельзя писать пустой `except:`?
  back: Он скрывает все ошибки, включая опечатки, и программа молча работает неправильно.

- front: Зачем функции вызывать `raise`?
  back: Чтобы честно сообщить о негодных данных, а не возвращать бессмысленный результат.
