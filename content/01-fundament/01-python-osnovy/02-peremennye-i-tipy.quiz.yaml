  answer: 1
  explanation: 'Знак = присваивает значение. Сравнение записывается двумя знаками: ==.'

- question: Чему равно 7 // 2?
  options:
    - '4'
    - '3.5'
    - '3'
    - '1'
  answer: 3
  explanation: Оператор // делит и отбрасывает дробную часть.

- question: Чему равно 7 % 2?
  options:
    - '1'
    - '0'
    - '3'
    - '3.5'
  answer: 1
  explanation: 'Оператор % возвращает остаток от деления: 7 = 2 · 3 + 1.'

- question: Какой тип у результата 10 / 2?
  options:
    - str
    - int
    - bool
    - float
  answer: 4
  explanation: 'Обычное деление всегда даёт дробное число: 10 / 2 равно 5.0.'

- question: Какое имя переменной соответствует принятому в Python стилю?
  options:
    - 2ports
    - port-count
    - port_count
    - PortCount
