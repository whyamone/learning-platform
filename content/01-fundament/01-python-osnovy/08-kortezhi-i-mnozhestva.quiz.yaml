- question: Чем кортеж отличается от списка?
  options:
    - Кортеж хранит только числа
    - Кортеж не может содержать больше двух элементов
    - В кортеже нет индексов
    - Кортеж нельзя изменить после создания
  answer: 4
  explanation: Кортеж — неизменяемая последовательность. Индексы и срезы работают так же, как у списка.

- question: Что выведет print(len({10, 20, 10, 30, 20}))?
  options:
    - '2'
    - '5'
    - Ошибку
    - '3'
  answer: 4
  explanation: 'Множество хранит только уникальные значения: 10, 20 и 30.'

- question: Как создать пустое множество?
  options:
    - '[]'
    - set()
    - '{}'
    - ()
  answer: 2
  explanation: Запись {} создаёт пустой словарь. Пустое множество создаётся только через set().

- question: a = {1, 2, 3}, b = {2, 3, 4}. Чему равно a & b?
  options:
    - '{1, 2, 3, 4}'
    - '{4}'
    - '{1}'
    - '{2, 3}'
  answer: 4
  explanation: 'Оператор & — пересечение: элементы, которые есть в обоих множествах.'

- question: Что произойдёт при ip, port = ("10.0.0.1", 22)?
  options:
    - В ip запишется 22, в port — адрес
    - В ip запишется адрес, в port — число 22
    - Возникнет ошибка
    - В обе переменные запишется весь кортеж
  answer: 2
  explanation: 'Это распаковка: значения кортежа раскладываются по переменным слева направо.'
