- question: Что произойдёт при открытии существующего файла в режиме "w"?
  options:
    - Файл откроется только для чтения
    - Новый текст допишется в конец
    - Его содержимое будет стёрто
    - Возникнет ошибка
  answer: 3
  explanation: Режим "w" начинает запись с пустого файла. Для дозаписи нужен режим "a".

- question: Зачем файл открывают через with?
  options:
    - Чтобы файл нельзя было изменить
    - Чтобы файл читался быстрее
    - Без with файл открыть нельзя
    - Чтобы файл гарантированно закрылся, даже если произойдёт ошибка
  answer: 4
  explanation: Конструкция with сама закрывает файл при выходе из блока.

- question: Зачем указывать encoding="utf-8" при открытии файла?
  options:
    - Чтобы русский текст читался одинаково в любой системе
    - Чтобы файл был защищён паролем
    - Это обязательный аргумент, без него будет ошибка
    - Чтобы файл занимал меньше места
  answer: 1
  explanation: Без явной кодировки Python берёт системную, и на Windows русский текст может исказиться.

- question: От какой папки отсчитывается относительный путь к файлу?
  options:
    - От папки, где лежит файл с кодом
    - От корня диска
    - От папки, из которой запущена программа
    - От домашней папки пользователя
  answer: 3
  explanation: Поэтому одна и та же программа может «не найти» файл, если запустить её из другой папки.

- question: Что делает Path("logs") / "app.log"?
  options:
    - Удаляет файл
    - Вызывает ошибку TypeError
    - Собирает путь logs/app.log
    - Делит одно число на другое
  answer: 3
  explanation: У объектов Path оператор / соединяет части пути и работает одинаково в Linux и Windows.
