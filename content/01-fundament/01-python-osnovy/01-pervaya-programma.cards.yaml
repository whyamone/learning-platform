- front: Что такое интерпретатор?
  back: Программа, которая читает код строку за строкой и выполняет его.

- front: Чем интерактивный режим отличается от запуска файла?
  back: В интерактивном режиме результат виден сразу, но код не сохраняется. В файле `.py` программа хранится и запускается сколько угодно раз.

- front: Как выйти из интерактивного режима Python?
  back: Набрать `exit()` или нажать `Ctrl+D`.

- front: Как читать сообщение об ошибке?
  back: 'Снизу вверх: последняя строка — тип и описание ошибки, выше — файл и номер строки.'

- front: Чем `print(2 + 3)` отличается от `print("2 + 3")`?
  back: Первое выведет `5` (вычисление), второе — `2 + 3` (строка выводится как есть).
