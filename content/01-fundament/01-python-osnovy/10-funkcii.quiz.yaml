- question: Чем return отличается от print()?
  options:
    - print() можно использовать только внутри функций
    - return выводит на экран, print() возвращает значение
    - Ничем
    - return отдаёт значение программе, print() только показывает его на экране
  answer: 4
  explanation: Результат return можно сохранить в переменную и использовать дальше. print() нужен только для человека.

- question: Что возвращает функция, в которой нет return?
  options:
    - '0'
    - Ошибку
    - Пустую строку
    - None
  answer: 4
  explanation: Функция без return возвращает специальное значение None.

- question: def connect(host, port=22). Что произойдёт при вызове connect("10.0.0.1")?
  options:
    - port будет равен None
    - Возникнет ошибка — не хватает аргумента
    - port будет равен "10.0.0.1"
    - Функция выполнится с port, равным 22
  answer: 4
  explanation: Если аргумент не передан, используется значение по умолчанию.

- question: Внутри функции создана переменная result. Что будет при обращении к ней снаружи?
  options:
    - Вернётся None
    - NameError — переменная существует только внутри функции
    - Вернётся её последнее значение
    - Вернётся 0
  answer: 2
  explanation: Переменные функции локальны. Данные выходят наружу только через return.

- question: Что такое параметр функции?
  options:
    - Имя самой функции
    - Комментарий перед функцией
    - Значение, которое функция возвращает
    - Имя в объявлении функции, которое получит значение при вызове
  answer: 4
  explanation: Параметр — имя в скобках после def. Конкретное значение при вызове называют аргументом.
