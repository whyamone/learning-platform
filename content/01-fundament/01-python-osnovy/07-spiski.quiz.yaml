- question: Что окажется в переменной после vlans = [10, 20].append(30)?
  options:
    - '30'
    - Ошибка
    - None
    - '[10, 20, 30]'
  answer: 3
  explanation: 'Метод append() меняет список на месте и возвращает None. Правильно: vlans.append(30) отдельной строкой.'

- question: a = [1, 2]; b = a; b.append(3). Чему равно a?
  options:
    - '[1, 2]'
    - '[3]'
    - Ошибка
    - '[1, 2, 3]'
  answer: 4
  explanation: 'b = a не создаёт копию: оба имени указывают на один список. Для копии нужен a.copy().'

- question: Чем sorted(items) отличается от items.sort()?
  options:
    - sorted() возвращает новый список, sort() меняет исходный
    - Ничем
    - sorted() работает только с числами
    - sort() возвращает новый список, sorted() меняет исходный
  answer: 1
  explanation: sort() — метод, меняет список на месте. sorted() — функция, возвращает отсортированную копию.

- question: Что вернёт [x * 2 for x in [1, 2, 3] if x > 1]?
  options:
    - '[2, 3]'
    - '[4, 6]'
    - '[2, 4, 6]'
    - '[1, 4, 6]'
  answer: 2
  explanation: Условие отбирает элементы больше 1 (это 2 и 3), затем каждый умножается на 2.

- question: Что делает items.pop()?
  options:
    - Удаляет последний элемент и возвращает его
    - Удаляет первый элемент
    - Очищает список
    - Возвращает последний элемент, не удаляя
  answer: 1
  explanation: pop() без аргумента удаляет и возвращает последний элемент. pop(0) — первый.
