- question: Как читать трассировку ошибки?
  options:
    - Достаточно посмотреть на номер строки
    - 'Сверху вниз: главное написано в первой строке'
    - Только среднюю часть
    - 'Снизу вверх: последняя строка содержит тип и описание ошибки'
  answer: 4
  explanation: Самое важное — последняя строка. Выше идёт путь, который привёл к ошибке.

- question: Почему except без указания типа ошибки — плохая практика?
  options:
    - Он ловит только SyntaxError
    - Он скрывает любые ошибки, включая опечатки в коде
    - Он работает медленнее
    - Он запрещён в Python 3
  answer: 2
  explanation: Перехватывать нужно конкретные исключения, которые ты умеешь обработать.

- question: Какое исключение возникнет при обращении к items[10], если в списке три элемента?
  options:
    - TypeError
    - ValueError
    - IndexError
    - KeyError
  answer: 3
  explanation: IndexError — нет элемента с таким индексом. KeyError относится к словарям.

- question: Когда выполняется блок finally?
  options:
    - Всегда — и при ошибке, и без неё
    - Только если произошла ошибка
    - Только если ошибки не было
    - Никогда, это устаревшая конструкция
  answer: 1
  explanation: 'finally используют для уборки: закрыть соединение, удалить временный файл.'

- question: Что делает оператор raise?
  options:
    - Печатает предупреждение и продолжает работу
    - Завершает программу без сообщения
    - Вызывает исключение
    - Перехватывает исключение
  answer: 3
  explanation: Через raise функция сообщает, что не может работать с полученными данными.
