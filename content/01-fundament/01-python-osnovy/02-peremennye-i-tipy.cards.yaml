- front: Что такое переменная?
  back: Имя, привязанное к значению. Значение можно заменить другим.

- front: Назови четыре базовых типа данных Python.
  back: '`int` — целое число, `float` — дробное, `str` — строка, `bool` — `True` или `False`.'

- front: Чем отличаются `/`, `//` и `%`?
  back: '`/` — обычное деление (результат `float`), `//` — деление с отбрасыванием дробной части, `%` — остаток от деления.'

- front: Что делает `x += 2`?
  back: 'То же, что `x = x + 2`: увеличивает значение переменной на 2.'

- front: Как узнать тип значения?
  back: 'Функцией `type()`: `type(3.14)` вернёт `<class ''float''>`.'
