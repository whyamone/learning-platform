- front: Что такое кортеж?
  back: 'Неизменяемая последовательность. Записывается в круглых скобках: `("10.0.0.1", 22)`.'

- front: Что такое распаковка?
  back: 'Раскладывание значений по переменным одной строкой: `ip, port = server`.'

- front: Чем множество отличается от списка?
  back: В множестве нет повторений, нет порядка и индексов. Зато проверка `in` работает очень быстро.

- front: Как убрать повторения из списка?
  back: 'Превратить его в множество: `set(items)`. Если нужен порядок — `sorted(set(items))`.'

- front: Что означают `&`, `|` и `-` для множеств?
  back: '`&` — пересечение (есть в обоих), `|` — объединение (всё вместе), `-` — разность (есть в первом, но нет во втором).'
