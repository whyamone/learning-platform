- question: name = "sw-core". Чему равно name[-1]?
  options:
    - Ошибка
    - r
    - e
    - s
  answer: 3
  explanation: 'Отрицательные индексы отсчитываются с конца: -1 — последний символ.'

- question: ip = "192.168.10.25". Чему равно ip[:3]?
  options:
    - '2.1'
    - '168'
    - '192.'
    - '192'
  answer: 4
  explanation: Срез [:3] берёт символы с индексами 0, 1 и 2. Конец среза не включается.

- question: Что вернёт "192.168.1.1".split(".")?
  options:
    - Строку 19216811
    - Список [192, 168, 1, 1]
    - Число 4
    - Список ['192', '168', '1', '1']
  answer: 4
  explanation: split() возвращает список строк. Чтобы получить числа, каждую часть нужно передать в int().

- question: name = "sw-core". После вызова name.upper() без присваивания чему равно name?
  options:
    - SW-CORE
    - Ошибка
    - Sw-core
    - sw-core
  answer: 4
  explanation: Строки неизменяемы. Метод возвращает новую строку, а исходная остаётся прежней.

- question: Что вернёт "-".join(["a", "b", "c"])?
  options:
    - a-b-c
    - abc-
    - '[''a-b-c'']'
    - -abc
  answer: 1
  explanation: join() склеивает элементы списка, вставляя между ними строку-разделитель.
