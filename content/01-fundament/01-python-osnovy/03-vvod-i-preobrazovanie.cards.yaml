- front: Как получить от пользователя целое число?
  back: '`int(input("Подсказка: "))` — сначала `input()` возвращает строку, затем `int()` превращает её в число.'

- front: Что такое f-строка?
  back: 'Строка с буквой `f` перед кавычками. В фигурных скобках подставляются значения переменных и выражений: `f"Портов: {count}"`.'

- front: Как вывести число с двумя знаками после запятой?
  back: 'Через формат в f-строке: `f"{value:.2f}"`.'

- front: Когда возникает `ValueError`?
  back: 'Когда тип значения подходящий, а само значение — нет. Пример: `int("abc")`.'

- front: Что делают параметры `sep` и `end` у `print()`?
  back: '`sep` задаёт разделитель между значениями, `end` — что напечатать в конце вместо перевода строки.'
