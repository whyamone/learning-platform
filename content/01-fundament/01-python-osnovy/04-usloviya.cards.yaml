- front: Что делает `elif`?
  back: Проверяет следующее условие, если предыдущие оказались ложными. Выполняется только первая подходящая ветка.

- front: Назови три логических оператора Python.
  back: '`and` — истинно, если оба условия истинны; `or` — если хотя бы одно; `not` — меняет значение на противоположное.'

- front: Как записать проверку «x от 1 до 10 включительно»?
  back: '`1 <= x <= 10`'

- front: Какие значения Python считает ложными?
  back: '`False`, `0`, пустую строку `""`, `None` и пустые коллекции (список, словарь, множество).'

- front: Что означает `IndentationError`?
  back: 'Ошибка в отступах: блок не сдвинут или сдвинут неодинаково.'
