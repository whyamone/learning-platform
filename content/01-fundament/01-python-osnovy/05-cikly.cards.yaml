- front: Чем `for` отличается от `while`?
  back: '`for` перебирает заранее известный набор элементов. `while` повторяет, пока условие истинно, — когда число повторений неизвестно.'

- front: Что выдаёт `range(2, 8, 2)`?
  back: 'Числа 2, 4, 6: начало включается, конец нет, шаг 2.'

- front: Чем `break` отличается от `continue`?
  back: '`break` завершает цикл целиком. `continue` пропускает остаток текущей итерации и переходит к следующей.'

- front: Что такое итерация?
  back: Один проход тела цикла.

- front: Как остановить зависшую программу в терминале?
  back: Нажать `Ctrl+C`.
