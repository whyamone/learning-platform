- front: Чем список отличается от строки?
  back: 'Список изменяем: его элементы можно заменять, добавлять и удалять. Строка неизменяема.'

- front: Как добавить элемент в конец списка?
  back: '`items.append(value)`'

- front: Почему после `b = a` изменение `b` меняет и `a`?
  back: Оба имени указывают на один и тот же список. Независимую копию создаёт `a.copy()`.

- front: Что такое генератор списка?
  back: 'Короткая запись построения списка: `[выражение for элемент in набор if условие]`.'

- front: Как перебрать список вместе с номерами элементов?
  back: '`for number, item in enumerate(items, start=1):`'
