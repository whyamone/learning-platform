- question: Зачем нужно виртуальное окружение?
  options:
    - Чтобы у каждого проекта были свои библиотеки нужных версий
    - Чтобы защитить код от копирования
    - Чтобы программа работала быстрее
    - Чтобы запускать Python без установки
  answer: 1
  explanation: Окружение изолирует библиотеки проекта друг от друга и от системного Python.

- question: Какой командой создать виртуальное окружение в папке .venv?
  options:
    - venv new
    - python3 create .venv
    - pip install venv
    - python3 -m venv .venv
  answer: 4
  explanation: Модуль venv входит в стандартную поставку Python и запускается через -m.

- question: Что делает команда pip freeze > requirements.txt?
  options:
    - Сохраняет список установленных библиотек с версиями в файл
    - Создаёт виртуальное окружение
    - Обновляет библиотеки до последних версий
    - Удаляет все библиотеки
  answer: 1
  explanation: По файлу requirements.txt окружение можно воссоздать на другом компьютере.

- question: Когда выполняется код под условием if __name__ == "__main__":?
  options:
    - Всегда
    - Никогда
    - Только при прямом запуске файла, но не при импорте
    - Только при импорте файла
  answer: 3
  explanation: При прямом запуске переменная __name__ равна "__main__", при импорте — имени модуля.

- question: После import math как вызвать функцию sqrt?
  options:
    - sqrt(16)
    - import sqrt(16)
    - math.sqrt(16)
    - math->sqrt(16)
  answer: 3
  explanation: При импорте модуля целиком его содержимое доступно через имя модуля и точку.
