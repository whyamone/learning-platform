- question: Какая опция нужна, чтобы скопировать папку со всем содержимым?
  options:
    - -r
    - -f
    - -a
    - -p
  answer: 1
  explanation: -r означает recursive — «вместе со всем вложенным». Без неё cp откажется копировать каталог.

- question: Как переименовать файл old.txt в new.txt?
  options:
    - rn old.txt new.txt
    - mv old.txt new.txt
    - cp old.txt new.txt
    - rename old.txt new.txt
  answer: 2
  explanation: 'Отдельной команды переименования нет: это перемещение под другим именем.'

- question: Какие файлы соответствуют шаблону sw-?.cfg?
  options:
    - Только sw-10.cfg
    - sw-1.cfg и sw-a.cfg, но не sw-10.cfg
    - Все файлы, начинающиеся с sw-
    - Только файл с именем sw-?.cfg
  answer: 2
  explanation: Знак ? заменяет ровно один символ. Любое количество символов заменяет *.

- question: Что нужно сделать перед удалением файлов по шаблону?
  options:
    - Выполнить ls с тем же шаблоном и посмотреть, что под него попадает
    - Перезагрузить компьютер
    - Ничего, удалённое можно достать из корзины
    - Сделать файлы исполняемыми
  answer: 1
  explanation: 'В командной строке корзины нет: удалённый файл не восстановить.'

- question: В каком каталоге лежат настройки системы и программ?
  options:
    - /var
    - /tmp
    - /home
    - /etc
  answer: 4
  explanation: В /var — логи и изменяющиеся данные, в /tmp — временные файлы, в /home — папки пользователей.
