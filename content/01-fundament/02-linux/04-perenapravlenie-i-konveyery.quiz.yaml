- question: Чем > отличается от >>?
  options:
    - '>> работает только с ошибками'
    - '> перезаписывает файл, >> дописывает в конец'
    - '> дописывает в конец, >> перезаписывает'
    - Ничем
  answer: 2
  explanation: Одиночная стрелка стирает прежнее содержимое файла.

- question: Что делает символ | между командами?
  options:
    - Записывает вывод в файл
    - Выполняет вторую команду, только если первая упала
    - Запускает обе команды одновременно
    - Передаёт вывод первой команды на вход второй
  answer: 4
  explanation: 'Это конвейер: данные идут слева направо от команды к команде.'

- question: Что выведет grep -v 200 access.log?
  options:
    - Количество строк с 200
    - Строки, в которых нет 200
    - Строки, в которых есть 200
    - Номера строк с 200
  answer: 2
  explanation: Опция -v инвертирует поиск. Количество совпадений даёт -c, номера строк — -n.

- question: Почему перед uniq обычно ставят sort?
  options:
    - uniq умеет работать только с числами
    - Без sort команда uniq не запускается
    - sort ускоряет работу uniq
    - uniq убирает только соседние одинаковые строки
  answer: 4
  explanation: После сортировки одинаковые строки оказываются рядом, и uniq может их схлопнуть.

- question: Что означает 2> errors.txt?
  options:
    - Прочитать данные из файла
    - Создать два файла
    - Записать вывод команды дважды
    - Записать в файл поток ошибок
  answer: 4
  explanation: Поток ошибок имеет номер 2, обычный вывод — номер 1.
