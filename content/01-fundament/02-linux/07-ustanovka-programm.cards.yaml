- front: Что делают `apt update` и `apt upgrade`?
  back: '`update` скачивает свежий список пакетов, `upgrade` устанавливает новые версии программ.'

- front: Что такое пакет?
  back: 'Архив с программой и описанием: версия, список файлов, зависимости.'

- front: Как найти и установить программу?
  back: '`apt search имя` — найти, `sudo apt install имя` — установить.'

- front: Что означает `&&` между командами?
  back: Выполнить вторую команду, только если первая завершилась успешно.

- front: Чем опасны команды вида `curl ... | sudo bash`?
  back: Они выполняют чужой скрипт с правами администратора. Использовать только с официальных сайтов.
