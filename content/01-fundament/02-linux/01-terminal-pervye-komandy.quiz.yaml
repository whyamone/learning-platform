- question: Какая команда показывает, в какой папке ты сейчас находишься?
  options:
    - cd
    - pwd
    - whoami
    - ls
  answer: 2
  explanation: pwd — print working directory, «показать рабочую папку».

- question: Что делает команда cd ..?
  options:
    - Поднимается на один уровень вверх
    - Возвращается в домашнюю папку
    - Показывает содержимое папки
    - Переходит в корень файловой системы
  answer: 1
  explanation: Две точки означают «папка уровнем выше». В домашнюю папку возвращает cd ~.

- question: Какой из путей абсолютный?
  options:
    - /home/ivan/study
    - ./notes.txt
    - study/linux
    - ../study
  answer: 1
  explanation: Абсолютный путь начинается с / и описывает дорогу от корня файловой системы.

- question: Что покажет ls -a?
  options:
    - Файлы в алфавитном порядке
    - Все файлы, включая скрытые
    - Только папки
    - Файлы с подробными сведениями
  answer: 2
  explanation: Скрытые файлы — те, чьи имена начинаются с точки. Подробный список даёт ls -l.

- question: Что делает mkdir -p study/linux/day1?
  options:
    - Создаёт всю цепочку вложенных папок сразу
    - Показывает путь к папке
    - Создаёт только папку day1 и выдаёт ошибку, если нет остальных
    - Удаляет папки
  answer: 1
  explanation: Опция -p создаёт недостающие родительские папки и не ругается, если папка уже есть.
