- front: Чем `127.0.0.1` отличается от `0.0.0.0` у слушающего сервера?
  back: '`127.0.0.1` — доступен только с этого же компьютера. `0.0.0.0` — доступен через любой интерфейс, то есть из сети.'

- front: Что делает `ss -tulpn`?
  back: Показывает слушающие TCP- и UDP-порты вместе с программами, которые их заняли.

- front: Что делает `curl -I адрес`?
  back: Запрашивает только заголовки ответа, включая код состояния.

- front: Что означают коды 200, 404 и 500?
  back: 200 — успех, 404 — не найдено, 500 — ошибка на сервере.

- front: Какой порядок диагностики «сервис не открывается»?
  back: Процесс запущен → порт слушается → на каком адресе → отвечает ли локально → доступен ли по сети → не мешает ли межсетевой экран.
