- question: Что хранится в переменной PATH?
  options:
    - Путь к домашней папке
    - Имя пользователя
    - Путь к текущей папке
    - Список каталогов, в которых оболочка ищет команды
  answer: 4
  explanation: Оболочка проверяет каталоги из PATH слева направо и запускает первую найденную программу.

- question: Чем export NAME=test отличается от NAME=test?
  options:
    - Ничем
    - Переменная с export передаётся программам, запущенным из этой оболочки
    - Без export переменную нельзя вывести через echo
    - export сохраняет переменную навсегда
  answer: 2
  explanation: Обычная переменная видна только в текущей оболочке.

- question: Почему скрипт в текущей папке запускают как ./script.sh, а не script.sh?
  options:
    - Текущая папка не входит в PATH
    - Без ./ скрипт запустится с ошибками
    - ./ даёт скрипту права администратора
    - Так требует bash для любых файлов
  answer: 1
  explanation: Оболочка ищет команды только в каталогах из PATH, поэтому путь указывают явно.

- question: Куда записать настройки, чтобы они действовали в каждом новом терминале?
  options:
    - В файл ~/.ssh/config
    - В файл /etc/hostname
    - В файл ~/.bashrc
    - В переменную PATH
  answer: 3
  explanation: Файл ~/.bashrc выполняется при каждом запуске оболочки.

- question: Почему пароли и ключи нельзя записывать в коде?
  options:
    - Пароль в коде нельзя изменить
    - Программа будет работать медленнее
    - Python не умеет хранить пароли в переменных
    - Код попадает в git и становится доступен другим
  answer: 4
  explanation: Секреты передают через переменные окружения и файл .env, который добавляют в .gitignore.
