- front: Чем процесс отличается от программы?
  back: Программа — файл на диске. Процесс — программа, которая сейчас выполняется.

- front: Как найти процесс по имени?
  back: '`ps aux | grep имя` или `pgrep -a имя`.'

- front: Чем `SIGTERM` отличается от `SIGKILL`?
  back: '`SIGTERM` (15) — просьба завершиться, процесс успевает убрать за собой. `SIGKILL` (9) — немедленное уничтожение.'

- front: Что делают `Ctrl+C` и `Ctrl+Z`?
  back: '`Ctrl+C` прерывает процесс, `Ctrl+Z` приостанавливает его.'

- front: С чего начинать диагностику службы?
  back: '`systemctl status имя` — работает ли она, затем `journalctl -u имя` — почему не работает.'
