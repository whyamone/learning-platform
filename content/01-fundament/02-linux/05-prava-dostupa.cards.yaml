- front: Что означают буквы `r`, `w` и `x` для файла?
  back: '`r` — читать, `w` — изменять, `x` — запускать как программу.'

- front: Как перевести права в числа?
  back: '`r` = 4, `w` = 2, `x` = 1. Числа складываются для владельца, группы и остальных: `rwxr-xr-x` = 755.'

- front: Какие права ставят на закрытый SSH-ключ?
  back: '`600` — читать и изменять может только владелец.'

- front: Что делает `sudo`?
  back: Выполняет одну команду от имени администратора (root).

- front: От чего зависит право удалить файл?
  back: От права записи (`w`) в каталог, где файл лежит, а не от прав самого файла.
