- question: 'Что означает первая строка скрипта #!/usr/bin/env bash?'
  options:
    - Она делает файл исполняемым
    - Это обычный комментарий
    - Она сообщает системе, какой программой выполнять файл
    - Она задаёт имя скрипта
  answer: 3
  explanation: Эта строка называется shebang.

- question: Какой код возврата означает успешное завершение команды?
  options:
    - '-1'
    - '1'
    - '255'
    - '0'
  answer: 4
  explanation: Ноль — успех, любое другое число — ошибка. Код последней команды хранится в $?.

- question: Почему переменные в скриптах берут в двойные кавычки?
  options:
    - Чтобы скрипт работал быстрее
    - Иначе переменная не подставится
    - Чтобы значение с пробелами не распалось на несколько слов
    - Чтобы переменная не изменилась
  answer: 3
  explanation: Без кавычек имя файла с пробелом превратится в два отдельных аргумента.

- question: Что хранится в переменной $1?
  options:
    - Количество аргументов
    - Первый аргумент, переданный скрипту
    - Имя скрипта
    - Код возврата последней команды
  answer: 2
  explanation: Имя скрипта — $0, количество аргументов — $#.

- question: Что делает строка set -euo pipefail в начале скрипта?
  options:
    - Отключает все сообщения об ошибках
    - Останавливает скрипт при ошибке и при обращении к несуществующей переменной
    - Запускает скрипт от имени администратора
    - Включает подробный вывод каждой команды
  answer: 2
  explanation: Без неё скрипт после ошибки продолжит выполняться, и последствия могут быть тяжёлыми.
