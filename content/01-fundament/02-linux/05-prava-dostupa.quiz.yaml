- question: Что означает запись -rwxr-x---?
  options:
    - Все могут читать и запускать
    - Это каталог, доступный всем
    - Владелец может всё, группа — читать и запускать, остальные — ничего
    - Владелец может только читать
  answer: 3
  explanation: 'Три тройки по порядку: владелец (rwx), группа (r-x), остальные (---).'

- question: Какому числу соответствуют права rw-r--r--?
  options:
    - '600'
    - '755'
    - '664'
    - '644'
  answer: 4
  explanation: rw- = 4 + 2 = 6, r-- = 4. Получается 6, 4, 4.

- question: Что нужно сделать, чтобы запустить скрипт как ./script.sh?
  options:
    - Скопировать его в /etc
    - Открыть его в nano
    - 'Дать ему право на выполнение: chmod +x script.sh'
    - Переименовать его в script.exe
  answer: 3
  explanation: Без права x оболочка ответит Permission denied.

- question: Что означает право x для каталога?
  options:
    - Возможность удалить каталог
    - Возможность войти в него через cd
    - Возможность видеть список файлов
    - Возможность запустить каталог как программу
  answer: 2
  explanation: Список файлов даёт право r, создание и удаление файлов внутри — право w.

- question: Почему не стоит постоянно работать под root?
  options:
    - Под root команды выполняются медленнее
    - Ошибка в команде может уничтожить систему без предупреждения
    - Под root недоступен терминал
    - Под root нельзя пользоваться интернетом
  answer: 2
  explanation: На root не действуют ограничения прав, поэтому отдельные команды выполняют через sudo.
