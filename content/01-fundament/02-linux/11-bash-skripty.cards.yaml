- front: Что такое shebang?
  back: Первая строка скрипта, например `#!/usr/bin/env bash`. Сообщает, какой программой выполнять файл.

- front: Что означают `$1`, `$#` и `$?` в bash?
  back: '`$1` — первый аргумент, `$#` — количество аргументов, `$?` — код возврата последней команды.'

- front: Что делает `$(команда)`?
  back: 'Выполняет команду и подставляет её вывод: `today=$(date +%F)`.'

- front: Что означают пять полей расписания cron?
  back: Минута, час, день месяца, месяц, день недели. Звёздочка — любое значение.

- front: Когда выбрать bash, а когда Python?
  back: 'Bash — чтобы запустить несколько команд подряд. Python — когда нужна логика: разбор текста, расчёты, больше тридцати-сорока строк.'
