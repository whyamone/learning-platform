- question: Что такое PID?
  options:
    - Уникальный номер процесса
    - Приоритет процесса
    - Имя пользователя, запустившего программу
    - Объём памяти, занятый программой
  answer: 1
  explanation: PID — process identifier. По нему процессу посылают сигналы.

- question: Чем kill 1234 отличается от kill -9 1234?
  options:
    - Ничем
    - Первая уничтожает немедленно, вторая просит завершиться
    - Первая вежливо просит завершиться, вторая уничтожает процесс немедленно
    - Вторая перезапускает процесс
  answer: 3
  explanation: По умолчанию отправляется SIGTERM, и процесс успевает сохранить данные. -9 — это SIGKILL.

- question: Что делает знак & в конце команды?
  options:
    - Запускает команду в фоне
    - Запускает команду от имени администратора
    - Повторяет команду дважды
    - Записывает вывод в файл
  answer: 1
  explanation: Терминал остаётся свободным, а список фоновых задач показывает jobs.

- question: Чем systemctl enable отличается от systemctl start?
  options:
    - Ничем
    - enable включает автозапуск при загрузке, start запускает службу сейчас
    - enable перезапускает службу
    - start включает автозапуск, enable запускает сейчас
  answer: 2
  explanation: Чтобы служба и работала сейчас, и поднималась после перезагрузки, нужны обе команды.

- question: Какой командой посмотреть журнал службы ssh?
  options:
    - journalctl -u ssh
    - cat ssh.log
    - systemctl log ssh
    - ps aux ssh
  answer: 1
  explanation: journalctl читает журнал systemd. Опция -u выбирает службу, -f следит в реальном времени.
