- front: Что делают `cp`, `mv` и `rm`?
  back: '`cp` копирует, `mv` перемещает и переименовывает, `rm` удаляет.'

- front: Что означает опция `-r` у `cp` и `rm`?
  back: 'Рекурсивно: применить к папке и всему её содержимому.'

- front: Чем `*` отличается от `?` в шаблонах имён?
  back: '`*` — любое количество любых символов, `?` — ровно один символ.'

- front: Как найти все файлы `.py` в текущей папке и вложенных?
  back: '`find . -name "*.py"`'

- front: Что лежит в `/etc`, `/var/log`, `/home` и `/tmp`?
  back: '`/etc` — настройки, `/var/log` — логи, `/home` — папки пользователей, `/tmp` — временные файлы.'
