- front: Чем `cat` отличается от `less`?
  back: '`cat` выводит файл целиком — для коротких файлов. `less` показывает постранично с поиском — для длинных.'

- front: Что делает `tail -f`?
  back: 'Следит за файлом: выводит новые строки по мере их появления.'

- front: Как выйти из vim без сохранения?
  back: Нажать `Esc`, набрать `:q!` и `Enter`.

- front: Как в `nano` сохранить файл и выйти?
  back: '`Ctrl+O` и `Enter` — сохранить, `Ctrl+X` — выйти.'

- front: Какой клавишей включается режим вставки в vim?
  back: Клавишей `i`. Вернуться в командный режим — `Esc`.
