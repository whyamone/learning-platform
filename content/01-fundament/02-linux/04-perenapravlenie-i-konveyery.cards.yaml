- front: Назови три стандартных потока.
  back: '`stdin` (0) — ввод, `stdout` (1) — обычный вывод, `stderr` (2) — ошибки.'

- front: Какой конвейер даёт «топ самых частых значений»?
  back: '`sort | uniq -c | sort -rn | head`'

- front: Что делают опции `-i`, `-v`, `-n`, `-r` у `grep`?
  back: '`-i` — без учёта регистра, `-v` — строки без совпадения, `-n` — с номерами строк, `-r` — поиск во всех файлах папки.'

- front: Что такое `/dev/null`?
  back: Особый файл, в котором всё записанное исчезает. Туда направляют ненужный вывод.

- front: Как вывести первую колонку из файла с пробелами-разделителями?
  back: '`cut -d " " -f 1 файл` или `awk ''{print $1}'' файл`.'
