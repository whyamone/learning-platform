- front: Чем открытый ключ отличается от закрытого?
  back: Открытый кладётся на серверы, его можно показывать. Закрытый хранится только у тебя и никому не передаётся.

- front: Что делает `ssh-copy-id`?
  back: Дописывает твой открытый ключ в `~/.ssh/authorized_keys` на сервере, после чего вход идёт без пароля.

- front: Зачем нужен файл `~/.ssh/config`?
  back: В нём записывают адрес, пользователя, порт и ключ под коротким именем, чтобы подключаться командой `ssh имя`.

- front: Что хранится в `known_hosts`?
  back: Отпечатки ключей серверов, к которым ты уже подключался. По ним клиент замечает подмену сервера.

- front: Зачем нужен `tmux` при работе по SSH?
  back: 'Он держит сеанс на сервере: задача продолжает работать, даже если связь оборвалась.'
