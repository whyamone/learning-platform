- front: Что такое переменная окружения?
  back: Именованное значение, которое оболочка передаёт запускаемым программам. Через них задают настройки.

- front: Как вывести значение переменной окружения?
  back: '`echo $ИМЯ`. Все переменные показывает `env`.'

- front: Как оболочка находит команду по имени?
  back: Ищет файл с таким именем в каталогах из `PATH` по порядку и запускает первый найденный.

- front: Как прочитать переменную окружения в Python?
  back: '`os.environ.get("ИМЯ", "значение по умолчанию")`'

- front: Зачем нужны файлы `.env` и `.env.example`?
  back: В `.env` лежат настоящие секреты, и он не попадает в git. В `.env.example` — тот же список переменных без секретов, он хранится в репозитории.
