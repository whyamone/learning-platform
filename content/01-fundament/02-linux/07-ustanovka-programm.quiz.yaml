- question: Чем apt update отличается от apt upgrade?
  options:
    - update обновляет список доступных пакетов, upgrade устанавливает новые версии
    - upgrade удаляет старые программы
    - Ничем
    - update устанавливает новые версии, upgrade обновляет список
  answer: 1
  explanation: 'update ничего не устанавливает. Поэтому команды выполняют парой: сначала update, потом upgrade.'

- question: Что такое репозиторий в контексте apt?
  options:
    - Хранилище пакетов, из которого берутся программы
    - Список запущенных процессов
    - Папка с личными файлами пользователя
    - Архив с резервной копией системы
  answer: 1
  explanation: Репозиторий ведут разработчики дистрибутива, поэтому программы в нём проверены.

- question: Что такое зависимость пакета?
  options:
    - Версия пакета
    - Автор пакета
    - Другой пакет, необходимый ему для работы
    - Размер пакета на диске
  answer: 3
  explanation: Менеджер пакетов сам находит и устанавливает зависимости.

- question: Чем apt purge отличается от apt remove?
  options:
    - Ничем
    - remove удаляет настройки, purge — программу
    - purge только скачивает пакет
    - purge удаляет программу вместе с её настройками
  answer: 4
  explanation: После remove файлы настроек остаются в системе.

- question: Куда ставят библиотеки Python для своего проекта?
  options:
    - В систему через apt
    - В систему через sudo pip
    - В виртуальное окружение через pip
    - В папку /etc
  answer: 3
  explanation: Системный Python принадлежит Ubuntu, и менять его библиотеки нельзя.
