- question: Какой командой посмотреть IP-адреса интерфейсов?
  options:
    - ipconfig
    - show ip interface brief
    - netstat -ip
    - ip addr
  answer: 4
  explanation: Краткий вариант — ip -br addr. Команда ipconfig относится к Windows.

- question: Сервер слушает адрес 127.0.0.1:8000. Кто может к нему подключиться?
  options:
    - Только программы на этом же компьютере
    - Никто
    - Любой компьютер в сети
    - Только компьютеры из той же подсети
  answer: 1
  explanation: 127.0.0.1 — петлевой адрес. Чтобы принимать подключения извне, сервер должен слушать 0.0.0.0.

- question: Какой командой узнать, какая программа заняла порт 8000?
  options:
    - ss -tulpn | grep :8000
    - ping 8000
    - ip route 8000
    - curl :8000
  answer: 1
  explanation: ss показывает сокеты, опция p добавляет имя процесса.

- question: Что означает код ответа 404?
  options:
    - Доступ запрещён
    - Запрошенный адрес не найден
    - Ошибка на сервере
    - Всё хорошо
  answer: 2
  explanation: 200 — успех, 403 — доступ запрещён, 500 — ошибка на стороне сервера.

- question: Чем проверить, открыт ли TCP-порт на удалённом узле?
  options:
    - ping адрес порт
    - ls адрес
    - nc -zv адрес порт
    - cat адрес:порт
  answer: 3
  explanation: ping проверяет только доступность узла, но не работу сервиса на порту.
