- front: Что делает `pwd`?
  back: Показывает текущую папку (print working directory).

- front: Чем абсолютный путь отличается от относительного?
  back: Абсолютный начинается с `/` и работает из любого места. Относительный отсчитывается от текущей папки.

- front: Что означают `~`, `.` и `..`?
  back: '`~` — домашняя папка, `.` — текущая, `..` — папка уровнем выше.'

- front: Как узнать, что делает команда?
  back: '`команда --help` — краткая справка, `man команда` — подробное руководство (выход по `q`).'

- front: Что делает клавиша Tab в терминале?
  back: Дописывает имя команды или файла. Двойное нажатие показывает варианты.
