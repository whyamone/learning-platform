- front: Что делает `JOIN`?
  back: Соединяет строки двух таблиц по условию, обычно по совпадению ключей.

- front: Чем `LEFT JOIN` отличается от `INNER JOIN`?
  back: '`INNER JOIN` оставляет только строки с парой. `LEFT JOIN` сохраняет все строки левой таблицы, а недостающее заполняет `NULL`.'

- front: Назови агрегатные функции SQL.
  back: '`COUNT` — количество, `SUM` — сумма, `AVG` — среднее, `MIN` и `MAX` — минимум и максимум.'
