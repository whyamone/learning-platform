- question: Чем PostgreSQL принципиально отличается от SQLite?
  options:
    - SQLite работает только в Windows
    - PostgreSQL не поддерживает SQL
    - Ничем, кроме названия
    - PostgreSQL — отдельный сервер, к которому подключаются по сети, SQLite — файл внутри приложения
  answer: 4
  explanation: Сервер базы данных рассчитан на много одновременных пользователей.

- question: Что такое транзакция?
  options:
    - Подключение к серверу
    - Резервная копия базы
    - Запрос на выборку
    - Набор изменений, который выполняется целиком или не выполняется вовсе
  answer: 4
  explanation: 'Пример: перевод денег состоит из списания и зачисления, и оба шага должны пройти вместе.'

- question: Что делает ROLLBACK?
  options:
    - Отменяет все изменения текущей транзакции
    - Перезапускает сервер
    - Удаляет базу данных
    - Сохраняет изменения
  answer: 1
  explanation: Сохраняет изменения команда COMMIT.
