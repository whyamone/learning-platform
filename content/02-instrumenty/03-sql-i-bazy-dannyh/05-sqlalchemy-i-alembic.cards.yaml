- front: Что такое ORM?
  back: 'Object-relational mapping: связь классов Python с таблицами базы. Позволяет работать с данными как с объектами.'

- front: Что такое сеанс в SQLAlchemy?
  back: Объект, через который читают и записывают данные. Изменения попадают в базу после `commit()`.

- front: Что такое миграция?
  back: Файл с одним шагом изменения структуры базы. Миграции применяются по порядку и хранятся в git.
