- front: Что такое первичный и внешний ключи?
  back: Первичный ключ однозначно определяет строку. Внешний ключ ссылается на первичный ключ другой таблицы.

- front: Что такое нормализация?
  back: Раскладывание данных по таблицам так, чтобы каждый факт хранился в одном месте и данные не противоречили друг другу.

- front: Зачем нужен индекс?
  back: Он ускоряет поиск по столбцу — ценой небольшого замедления записи.
