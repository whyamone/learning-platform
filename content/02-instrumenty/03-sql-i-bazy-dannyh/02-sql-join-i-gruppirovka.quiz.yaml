- question: Чем LEFT JOIN отличается от INNER JOIN?
  options:
    - LEFT JOIN работает только с числами
    - LEFT JOIN сохраняет все строки левой таблицы, даже без пары в правой
    - INNER JOIN сохраняет все строки обеих таблиц
    - Ничем
  answer: 2
  explanation: INNER JOIN оставляет только строки, у которых нашлась пара.

- question: Что делает GROUP BY?
  options:
    - Удаляет повторяющиеся строки
    - Объединяет строки с одинаковым значением в группы для подсчёта итогов
    - Соединяет таблицы
    - Сортирует строки
  answer: 2
  explanation: Вместе с ним используют COUNT, SUM, AVG и другие агрегатные функции.

- question: Чем HAVING отличается от WHERE?
  options:
    - HAVING используется вместо ORDER BY
    - Ничем
    - WHERE работает только с числами
    - HAVING отбирает группы после группировки, WHERE — строки до неё
  answer: 4
  explanation: Условие на результат COUNT или SUM можно записать только в HAVING.
