- front: Назови четыре основные команды работы с данными в SQL.
  back: '`SELECT` — выбрать, `INSERT` — добавить, `UPDATE` — изменить, `DELETE` — удалить.'

- front: Что означает `NULL`?
  back: Отсутствие значения. Проверяется через `IS NULL`, а не через знак равенства.

- front: В каком порядке пишутся части запроса на выборку?
  back: '`SELECT` → `FROM` → `WHERE` → `ORDER BY` → `LIMIT`.'
