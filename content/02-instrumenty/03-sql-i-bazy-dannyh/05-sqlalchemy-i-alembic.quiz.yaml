- question: Что такое ORM?
  options:
    - Способ работать с таблицами базы через классы и объекты языка программирования
    - Формат резервной копии
    - Язык запросов
    - Вид индекса
  answer: 1
  explanation: Строка таблицы превращается в объект, столбцы — в его атрибуты.

- question: Зачем нужны миграции?
  options:
    - Чтобы изменять структуру базы по шагам без потери данных
    - Чтобы ускорять запросы
    - Чтобы шифровать данные
    - Чтобы переносить сервер в другой дата-центр
  answer: 1
  explanation: 'Каждая миграция описывает один шаг: добавить таблицу, столбец, индекс.'

- question: Что делает команда alembic upgrade head?
  options:
    - Применяет все ещё не применённые миграции
    - Создаёт новую миграцию
    - Удаляет базу данных
    - Откатывает последнюю миграцию
  answer: 1
  explanation: Этот проект выполняет её при каждом запуске контейнера.
