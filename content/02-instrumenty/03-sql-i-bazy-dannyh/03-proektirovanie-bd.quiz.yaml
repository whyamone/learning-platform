- question: Что такое первичный ключ?
  options:
    - Столбец с самым длинным значением
    - Столбец, значение которого однозначно определяет строку
    - Пароль к базе данных
    - Первый столбец таблицы
  answer: 2
  explanation: Значения первичного ключа уникальны и не бывают пустыми.

- question: Что делает внешний ключ?
  options:
    - Связывает строку одной таблицы со строкой другой
    - Ускоряет сортировку
    - Запрещает удалять таблицу
    - Шифрует данные
  answer: 1
  explanation: Например, в таблице интерфейсов хранится идентификатор устройства.

- question: Как реализуют связь «многие ко многим»?
  options:
    - Копированием данных в обе таблицы
    - Объединением двух таблиц в одну
    - Через промежуточную таблицу с двумя внешними ключами
    - Одним столбцом со списком значений через запятую
  answer: 3
  explanation: Например, связь интерфейсов и VLAN хранится в отдельной таблице.
