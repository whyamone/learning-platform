- front: Что такое транзакция?
  back: 'Набор изменений, выполняемый целиком: либо применяются все, либо ни одно.'

- front: Что делают `COMMIT` и `ROLLBACK`?
  back: '`COMMIT` фиксирует изменения транзакции, `ROLLBACK` отменяет их.'

- front: Когда хватит SQLite, а когда нужен PostgreSQL?
  back: SQLite — один пользователь, локальное приложение. PostgreSQL — много одновременных пользователей, сетевой доступ.
