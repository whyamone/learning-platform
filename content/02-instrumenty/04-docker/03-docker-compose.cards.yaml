- front: Что такое Docker Compose?
  back: Инструмент для запуска нескольких связанных контейнеров, описанных в `docker-compose.yml`.

- front: Что делают `docker compose up` и `docker compose down`?
  back: '`up` создаёт и запускает сервисы, `down` останавливает и удаляет контейнеры и сеть.'

- front: Как сервисы Compose находят друг друга?
  back: 'По имени сервиса: оно работает как имя узла во внутренней сети Compose.'
