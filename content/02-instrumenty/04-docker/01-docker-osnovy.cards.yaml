- front: Что такое образ и контейнер?
  back: Образ — шаблон с программой и её окружением. Контейнер — запущенный экземпляр образа.

- front: Чем контейнер отличается от виртуальной машины?
  back: Контейнер использует ядро операционной системы хоста и запускается за секунды. Виртуальная машина содержит свою операционную систему целиком.

- front: Что такое том?
  back: Папка вне контейнера, подключённая к нему. Данные в ней переживают удаление контейнера.
