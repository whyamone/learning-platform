- question: Для чего нужен Docker Compose?
  options:
    - Чтобы заменить Dockerfile
    - Чтобы описать несколько связанных контейнеров в одном файле и запускать их одной командой
    - Чтобы шифровать контейнеры
    - Чтобы собирать образы быстрее
  answer: 2
  explanation: Например, приложение и база данных поднимаются вместе.

- question: Как один сервис в Compose обращается к другому?
  options:
    - Никак, сервисы изолированы друг от друга
    - Через localhost
    - Только по IP-адресу
    - По имени сервиса как по имени узла
  answer: 4
  explanation: Compose создаёт общую сеть, в которой имена сервисов разрешаются автоматически.

- question: Что делает healthcheck?
  options:
    - Измеряет скорость сети
    - Обновляет образ
    - Периодически проверяет, что сервис внутри контейнера действительно работает
    - Удаляет остановленные контейнеры
  answer: 3
  explanation: Контейнер может быть запущен, а программа в нём — зависнуть. Проверка это обнаружит.
