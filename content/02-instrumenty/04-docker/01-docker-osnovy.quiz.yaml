- question: Чем образ отличается от контейнера?
  options:
    - Ничем
    - Образ хранит только данные пользователя
    - Контейнер — шаблон, образ — запущенный экземпляр
    - Образ — неизменяемый шаблон, контейнер — запущенный экземпляр образа
  answer: 4
  explanation: Из одного образа можно запустить много контейнеров.

- question: Что означает запись -p 8080:80 при запуске контейнера?
  options:
    - Запускается 80 контейнеров
    - Контейнер получает 8080 мегабайт памяти
    - Порт 80 компьютера ведёт на порт 8080 контейнера
    - Порт 8080 компьютера ведёт на порт 80 внутри контейнера
  answer: 4
  explanation: 'Формат записи: порт на компьютере, двоеточие, порт в контейнере.'

- question: Зачем нужны тома?
  options:
    - Чтобы контейнер работал быстрее
    - Чтобы данные сохранялись после удаления контейнера
    - Чтобы ограничить доступ к сети
    - Чтобы уменьшить размер образа
  answer: 2
  explanation: Всё, что записано внутри контейнера без тома, исчезает вместе с ним.
