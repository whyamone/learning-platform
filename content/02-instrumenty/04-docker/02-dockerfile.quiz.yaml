- question: Что задаёт инструкция FROM?
  options:
    - Базовый образ, на основе которого строится новый
    - Имя автора
    - Команду запуска контейнера
    - Папку с исходным кодом
  answer: 1
  explanation: С неё начинается любой Dockerfile.

- question: Почему файл с зависимостями копируют и устанавливают раньше остального кода?
  options:
    - Чтобы при правке кода слой с библиотеками брался из кэша
    - Чтобы образ стал меньше
    - Чтобы код нельзя было изменить
    - Так требует синтаксис Dockerfile
  answer: 1
  explanation: Docker пересобирает только изменившийся слой и все следующие за ним.

- question: Чем RUN отличается от CMD?
  options:
    - CMD выполняется при сборке, RUN — при запуске
    - RUN выполняется при сборке образа, CMD — при запуске контейнера
    - RUN можно использовать только один раз
    - Ничем
  answer: 2
  explanation: RUN устанавливает программы в образ, CMD задаёт команду по умолчанию.
