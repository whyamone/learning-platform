- front: Что делают инструкции `FROM`, `COPY`, `RUN` и `CMD`?
  back: '`FROM` — базовый образ, `COPY` — скопировать файлы, `RUN` — выполнить команду при сборке, `CMD` — команда при запуске контейнера.'

- front: Что такое слой образа?
  back: Результат одной инструкции Dockerfile. Неизменившиеся слои берутся из кэша, поэтому сборка ускоряется.

- front: Зачем нужен `.dockerignore`?
  back: 'В нём перечислено, что не копировать в образ: `.git`, виртуальное окружение, секреты.'
