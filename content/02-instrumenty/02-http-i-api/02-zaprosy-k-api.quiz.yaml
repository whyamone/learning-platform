- question: Зачем указывать таймаут при сетевом запросе?
  options:
    - Чтобы сервер вернул больше данных
    - Чтобы зашифровать запрос
    - Чтобы программа не зависла навсегда, если сервер не отвечает
    - Чтобы запрос выполнялся быстрее
  answer: 3
  explanation: Без таймаута один недоступный сервер остановит всю программу.

- question: Где хранить ключ доступа к API?
  options:
    - В переменной окружения или файле .env, который не попадает в git
    - В названии репозитория
    - Прямо в коде программы
    - В файле README
  answer: 1
  explanation: Ключ в коде попадёт в историю git и станет доступен посторонним.

- question: Что означает ответ с кодом 429?
  options:
    - Неверный формат данных
    - Запрос выполнен успешно
    - Превышено допустимое число запросов
    - Сервер не найден
  answer: 3
  explanation: Нужно подождать и повторить запрос позже.
