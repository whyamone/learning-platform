- front: Что такое внедрение зависимостей?
  back: Функция не создаёт нужные объекты сама, а получает их готовыми. В FastAPI это делает `Depends()`.

- front: Назови три слоя типичного веб-приложения.
  back: Маршруты принимают запросы, сервисы содержат логику, модели описывают данные.

- front: Чем удобно внедрение зависимостей в тестах?
  back: 'Зависимость легко подменить: вместо настоящей базы подставить временную.'
