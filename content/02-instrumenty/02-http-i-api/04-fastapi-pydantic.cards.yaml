- front: Что такое Pydantic?
  back: 'Библиотека для описания структур данных с проверкой: класс с полями и типами проверяет входные данные.'

- front: Что означает код ответа 422?
  back: 'Данные запроса не прошли проверку: неверный тип или нарушено ограничение поля.'

- front: Что такое валидация?
  back: 'Проверка того, что данные корректны: нужные поля есть, типы и значения допустимы.'
