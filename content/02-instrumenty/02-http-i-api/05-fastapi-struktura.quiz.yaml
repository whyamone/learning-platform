- question: Что делает Depends() в FastAPI?
  options:
    - Подключает базу данных напрямую
    - Сообщает, что параметр нужно получить, вызвав указанную функцию-зависимость
    - Откладывает выполнение функции
    - Запускает тесты
  answer: 2
  explanation: Так обработчик получает, например, сеанс базы данных.

- question: Зачем нужен APIRouter?
  options:
    - Чтобы заменить uvicorn
    - Чтобы разложить маршруты по отдельным файлам
    - Чтобы ускорить приложение
    - Чтобы шифровать запросы
  answer: 2
  explanation: Каждый раздел приложения описывается своим маршрутизатором и подключается в main.py.

- question: Почему логику выносят из обработчиков маршрутов в отдельный слой сервисов?
  options:
    - Чтобы скрыть код от пользователей
    - Иначе FastAPI не запустится
    - Так приложение занимает меньше памяти
    - Её можно проверять тестами без веб-сервера и использовать в разных местах
  answer: 4
  explanation: Обработчик только принимает запрос и отдаёт ответ.
