- question: Что делает декоратор @app.get("/devices")?
  options:
    - Импортирует модуль devices
    - Запускает сервер
    - Связывает функцию с GET-запросами на адрес /devices
    - Создаёт таблицу в базе данных
  answer: 3
  explanation: Функция под декоратором называется обработчиком маршрута.

- question: Чем параметр пути отличается от параметра запроса?
  options:
    - Параметр запроса передаётся только в теле
    - Ничем
    - Параметр пути всегда число
    - Параметр пути — часть адреса, параметр запроса идёт после знака вопроса
  answer: 4
  explanation: В адресе /devices/5?detail=true число 5 — параметр пути, detail — параметр запроса.

- question: Что находится по адресу /docs у приложения на FastAPI?
  options:
    - Исходный код приложения
    - Автоматически созданная интерактивная документация
    - Файл настроек
    - Журнал ошибок
  answer: 2
  explanation: FastAPI строит её по описанию маршрутов и типов.
