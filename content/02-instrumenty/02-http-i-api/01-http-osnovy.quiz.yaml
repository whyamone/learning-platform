- question: Какой метод HTTP используют для получения данных?
  options:
    - POST
    - GET
    - PUT
    - DELETE
  answer: 2
  explanation: POST создаёт, PUT и PATCH изменяют, DELETE удаляет.

- question: Что означает код ответа 500?
  options:
    - Адрес не найден
    - Запрос выполнен успешно
    - Требуется авторизация
    - Ошибка на стороне сервера
  answer: 4
  explanation: Коды 4xx — ошибка в запросе клиента, 5xx — ошибка сервера.

- question: Где в запросе обычно передают ключ доступа к API?
  options:
    - В заголовке
    - В расширении файла
    - В названии метода
    - В коде состояния
  answer: 1
  explanation: Чаще всего это заголовок Authorization.
