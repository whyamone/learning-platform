- front: Что такое маршрут?
  back: Связь между адресом с методом HTTP и функцией, которая на них отвечает.

- front: Что такое uvicorn?
  back: Сервер, который запускает приложение на FastAPI и принимает сетевые запросы.

- front: Чем параметр пути отличается от параметра запроса?
  back: 'Параметр пути — часть адреса: `/devices/5`. Параметр запроса идёт после `?`: `/devices?vendor=cisco`.'
