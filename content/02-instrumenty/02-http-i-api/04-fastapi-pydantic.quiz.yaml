- question: Что делает модель Pydantic?
  options:
    - Создаёт таблицу в базе данных
    - Описывает структуру данных и проверяет, что данные ей соответствуют
    - Отправляет запросы к API
    - Рисует графики
  answer: 2
  explanation: Некорректные данные отклоняются с понятным описанием ошибки.

- question: Какой код вернёт FastAPI, если тело запроса не соответствует модели?
  options:
    - '404'
    - '422'
    - '200'
    - '500'
  answer: 2
  explanation: 422 означает, что запрос понятен, но данные не прошли проверку.

- question: Зачем делать отдельные модели для создания записи и для ответа?
  options:
    - 'У них разный набор полей: например, идентификатор появляется только в ответе'
    - Чтобы ускорить сервер
    - Так требует Python
    - Чтобы код был длиннее
  answer: 1
  explanation: Клиент не должен задавать идентификатор, а в ответе он нужен.
