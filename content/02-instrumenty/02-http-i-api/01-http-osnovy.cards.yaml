- front: Из чего состоит HTTP-запрос?
  back: Метод, адрес, заголовки и необязательное тело.

- front: Что означают группы кодов 2xx, 4xx и 5xx?
  back: 2xx — успех, 4xx — ошибка в запросе клиента, 5xx — ошибка на сервере.

- front: Что такое REST?
  back: 'Подход к построению API: адреса обозначают ресурсы, а методы HTTP — действия над ними.'
