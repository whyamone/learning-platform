- front: Какие библиотеки используют для HTTP-запросов в Python?
  back: '`requests` — простая и распространённая, `httpx` — современная, с поддержкой асинхронности.'

- front: Что такое rate limit?
  back: Ограничение числа запросов к API за единицу времени. При превышении приходит код 429.

- front: Как правильно повторять запрос после сбоя?
  back: С нарастающей паузой между попытками и с ограничением числа попыток.
