- front: Что такое системный промпт?
  back: Инструкция, которая задаёт модели роль и правила поведения на весь диалог.

- front: Как бот «помнит» диалог?
  back: Сам хранит сообщения в базе и при каждом запросе передаёт модели историю.

- front: Из каких частей состоит проект бота с нейросетью?
  back: Обработчики Telegram, обращение к модели по API, база с историей, настройки в `.env`, запуск через Docker Compose.
