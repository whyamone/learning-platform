- question: Зачем боту передавать модели историю диалога?
  options:
    - Модель не помнит прошлые сообщения — она видит только то, что есть в текущем запросе
    - Так требует Telegram
    - Чтобы уменьшить расход токенов
    - Чтобы ответы приходили быстрее
  answer: 1
  explanation: Каждый запрос к модели независим, поэтому контекст передаётся заново.

- question: Что задаёт системный промпт?
  options:
    - Максимальную длину ответа
    - Роль и правила поведения модели на весь диалог
    - Язык программирования бота
    - Адрес сервера модели
  answer: 2
  explanation: 'Например: «Ты помощник сетевого инженера, отвечай кратко».'

- question: Почему длину истории диалога нужно ограничивать?
  options:
    - База данных не хранит больше ста строк
    - Иначе бот перестанет запускаться
    - Контекстное окно модели конечно, а длинный контекст замедляет ответ
    - Telegram запрещает длинные диалоги
  answer: 3
  explanation: Обычно оставляют последние сообщения или сжимают старые в краткое изложение.
