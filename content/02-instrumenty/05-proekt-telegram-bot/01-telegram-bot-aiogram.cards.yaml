- front: Что такое Bot API?
  back: 'Интерфейс, через который программа управляет ботом в Telegram: получает события и отправляет сообщения.'

- front: Что такое машина состояний в боте?
  back: 'Способ вести диалог по шагам: бот помнит, на каком шаге находится пользователь, и ждёт соответствующий ответ.'

- front: Где хранить токен бота?
  back: В переменной окружения или файле `.env`, который не попадает в git.
