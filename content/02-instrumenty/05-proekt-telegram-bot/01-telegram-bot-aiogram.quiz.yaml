- question: Что такое токен бота?
  options:
    - Имя бота в Telegram
    - Секретная строка, по которой Telegram узнаёт твоего бота
    - Номер версии библиотеки
    - Адрес сервера Telegram
  answer: 2
  explanation: Токен выдаёт BotFather. Хранить его нужно в .env, а не в коде.

- question: Что делает обработчик в aiogram?
  options:
    - Реагирует на событие определённого вида — команду, текст, нажатие кнопки
    - Отправляет сообщения всем пользователям
    - Хранит токен
    - Подключает базу данных
  answer: 1
  explanation: На каждое входящее событие подбирается подходящий обработчик.

- question: Что такое long polling?
  options:
    - Способ шифрования сообщений
    - Бот отправляет длинные сообщения частями
    - Бот сам регулярно спрашивает у Telegram, нет ли новых сообщений
    - Telegram присылает сообщения на адрес бота
  answer: 3
  explanation: 'Это самый простой способ запуска: не нужен открытый в интернет адрес.'
