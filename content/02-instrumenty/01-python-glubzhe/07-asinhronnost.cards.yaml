- front: Чем конкурентность отличается от параллелизма?
  back: Конкурентность — задачи выполняются по очереди, уступая друг другу на время ожидания. Параллелизм — задачи выполняются одновременно на разных ядрах.

- front: Что такое корутина?
  back: Функция, объявленная через `async def`. Её выполнение можно приостановить на `await`.

- front: Что делает `asyncio.gather()`?
  back: Запускает несколько корутин одновременно и ждёт завершения всех.
