- front: Что такое декоратор?
  back: Функция, оборачивающая другую функцию, чтобы добавить поведение, не меняя её код. Применяется записью `@имя`.

- front: Что такое контекстный менеджер?
  back: 'Объект для конструкции `with`: выполняет подготовку при входе и уборку при выходе из блока.'

- front: Приведи примеры декораторов из знакомых библиотек.
  back: '`@dataclass`, `@pytest.fixture`, `@router.get("/path")` в FastAPI.'
