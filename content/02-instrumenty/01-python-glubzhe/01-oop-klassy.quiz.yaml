- question: Чем класс отличается от объекта?
  options:
    - Класс — описание, объект — конкретный экземпляр, созданный по этому описанию
    - Ничем, это синонимы
    - Объект — описание, класс — экземпляр
    - Класс хранит данные, объект — только функции
  answer: 1
  explanation: По одному классу Device можно создать сколько угодно объектов-устройств.

- question: Для чего нужен метод __init__?
  options:
    - Он выводит объект на экран
    - Он импортирует класс из другого файла
    - Он удаляет объект
    - Он задаёт начальные значения атрибутов при создании объекта
  answer: 4
  explanation: __init__ вызывается автоматически при создании объекта.

- question: Что такое self в методах класса?
  options:
    - Значение, которое возвращает метод
    - Ссылка на объект, у которого вызван метод
    - Встроенная функция Python
    - Имя класса
  answer: 2
  explanation: Через self метод обращается к атрибутам своего объекта.
