- front: Назови уровни логирования по возрастанию важности.
  back: '`DEBUG`, `INFO`, `WARNING`, `ERROR`, `CRITICAL`.'

- front: Что такое пакет в Python?
  back: Папка с модулями, которую можно импортировать. Обычно содержит файл `__init__.py`.

- front: Зачем нужен `pyproject.toml`?
  back: Единый файл с описанием проекта, зависимостями и настройками инструментов — линтера, тестов.
