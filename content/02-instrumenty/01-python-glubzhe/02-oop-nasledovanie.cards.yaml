- front: Что такое наследование?
  back: 'Создание класса на основе другого: дочерний класс получает атрибуты и методы родительского.'

- front: Что такое полиморфизм?
  back: 'Возможность одинаково вызывать метод у объектов разных классов: каждый выполняет его по-своему.'

- front: Чем композиция отличается от наследования?
  back: Наследование — отношение «является» (коммутатор является устройством). Композиция — «содержит» (устройство содержит интерфейсы).
