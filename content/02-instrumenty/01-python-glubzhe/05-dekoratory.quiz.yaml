- question: Что такое декоратор?
  options:
    - Функция, которая принимает другую функцию и возвращает её с добавленным поведением
    - Способ переименовать функцию
    - Особый тип переменной
    - Комментарий перед функцией
  answer: 1
  explanation: Запись @timed над функцией равнозначна func = timed(func).

- question: Что гарантирует конструкция with?
  options:
    - Что код выполнится быстрее
    - Что ресурс будет освобождён, даже если внутри блока произойдёт ошибка
    - Что переменная станет глобальной
    - Что ошибок не будет
  answer: 2
  explanation: Файл закроется, соединение разорвётся, блокировка снимется.

- question: Зачем в декораторе используют functools.wraps?
  options:
    - Чтобы скрыть функцию от импорта
    - Чтобы функцию можно было вызвать дважды
    - Чтобы обёрнутая функция сохранила своё имя и документацию
    - Чтобы декоратор работал быстрее
  answer: 3
  explanation: Без wraps у функции окажется имя внутренней обёртки.
