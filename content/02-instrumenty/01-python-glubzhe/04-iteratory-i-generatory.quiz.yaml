- question: Что делает ключевое слово yield?
  options:
    - Импортирует модуль
    - Вызывает исключение
    - Отдаёт значение и приостанавливает функцию до следующего запроса
    - Завершает функцию и возвращает значение
  answer: 3
  explanation: Функция с yield становится генератором и продолжает работу с места остановки.

- question: В чём главное преимущество генератора перед списком?
  options:
    - К элементам генератора можно обращаться по индексу
    - Значения вычисляются по одному и не занимают память все сразу
    - Генератор работает быстрее в любом случае
    - Генератор можно изменять
  answer: 2
  explanation: Это важно при обработке больших файлов и потоков данных.

- question: Чем (x * 2 for x in items) отличается от [x * 2 for x in items]?
  options:
    - Второе работает только с числами
    - Первое — генератор, значения появляются по запросу. Второе — готовый список
    - Первое — кортеж
    - Ничем
  answer: 2
  explanation: Круглые скобки создают генераторное выражение.
