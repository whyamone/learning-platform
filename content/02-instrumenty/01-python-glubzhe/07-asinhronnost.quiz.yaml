- question: Для каких задач асинхронность даёт выигрыш?
  options:
    - 'Для задач с ожиданием: сетевые запросы, обращения к базе, чтение файлов'
    - Только для вывода на экран
    - Для тяжёлых вычислений на процессоре
    - Для любых задач без исключения
  answer: 1
  explanation: Пока одна операция ждёт ответа сети, программа занимается другой.

- question: Что делает await?
  options:
    - Ждёт результата корутины, не блокируя остальные задачи
    - Запускает новый поток
    - Завершает корутину с ошибкой
    - Останавливает всю программу
  answer: 1
  explanation: На время ожидания управление возвращается циклу событий.

- question: Почему нельзя вызывать time.sleep() внутри корутины?
  options:
    - Он блокирует цикл событий, и все остальные задачи замирают
    - Он запрещён в Python 3
    - Он вызывает ошибку синтаксиса
    - Он работает слишком быстро
  answer: 1
  explanation: В асинхронном коде используют await asyncio.sleep().
