- front: Что такое генератор?
  back: 'Функция с `yield`: отдаёт значения по одному и между запросами приостанавливается.'

- front: Что означает «ленивое вычисление»?
  back: Значение вычисляется только в тот момент, когда оно понадобилось, а не заранее.

- front: Когда использовать генератор вместо списка?
  back: 'Когда данных много или они приходят потоком: большой файл, записи из базы, ответы API.'
