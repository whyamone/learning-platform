- question: Что такое наследование?
  options:
    - Создание нового класса на основе существующего с получением его атрибутов и методов
    - Копирование объекта
    - Удаление ненужных методов из класса
    - Передача аргументов в функцию
  answer: 1
  explanation: Дочерний класс получает всё от родительского и может добавить или изменить поведение.

- question: Что делает super().__init__()?
  options:
    - Удаляет родительский класс
    - Делает метод закрытым
    - Создаёт новый класс
    - Вызывает конструктор родительского класса
  answer: 4
  explanation: Так дочерний класс не дублирует код инициализации родителя.

- question: Когда композиция лучше наследования?
  options:
    - Когда один объект содержит другой, а не является его разновидностью
    - Всегда, наследование устарело
    - Когда в классе больше трёх методов
    - Когда класс не имеет атрибутов
  answer: 1
  explanation: У устройства есть интерфейсы — это композиция. Коммутатор является устройством — это наследование.
