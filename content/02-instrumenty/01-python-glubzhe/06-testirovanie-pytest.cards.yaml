- front: Что такое `assert`?
  back: 'Утверждение: если выражение ложно, тест падает. `assert add(2, 3) == 5`.'

- front: Что такое фикстура?
  back: 'Функция с декоратором `@pytest.fixture`, которая готовит всё нужное тесту: данные, временную папку, базу.'

- front: Что такое mock?
  back: Подделка, заменяющая настоящую зависимость в тесте — например, сетевой запрос.
