- question: Проверяет ли Python аннотации типов во время выполнения программы?
  options:
    - Нет, они служат подсказкой для человека и инструментов проверки
    - Да, при несовпадении типа программа падает
    - Да, но только для чисел
    - Только в функциях без return
  answer: 1
  explanation: Типы проверяют отдельные инструменты — mypy или pyright — и редактор кода.

- question: Что даёт декоратор @dataclass?
  options:
    - Сохраняет объекты в базу данных
    - Ускоряет работу класса
    - Делает класс неизменяемым
    - Автоматически создаёт __init__ и другие служебные методы по описанию полей
  answer: 4
  explanation: Достаточно перечислить поля с типами — конструктор писать не нужно.

- question: Что означает аннотация str | None?
  options:
    - Значение может быть строкой или None
    - Значение должно быть одновременно строкой и None
    - Значение не может быть строкой
    - Это ошибка синтаксиса
  answer: 1
  explanation: Вертикальная черта объединяет допустимые типы.
