- question: Зачем нужны автоматические тесты?
  options:
    - Чтобы заменить документацию
    - Чтобы программа работала быстрее
    - Чтобы скрыть ошибки от пользователей
    - Чтобы после каждой правки быстро убедиться, что ничего не сломалось
  answer: 4
  explanation: Тесты позволяют менять код без страха.

- question: Что такое фикстура в pytest?
  options:
    - Тест, который всегда падает
    - Отчёт о результатах тестов
    - Функция, которая готовит данные или окружение для теста
    - Список пропущенных тестов
  answer: 3
  explanation: Тест получает фикстуру, указав её имя в параметрах.

- question: Что делает pytest.mark.parametrize?
  options:
    - Запускает один тест на нескольких наборах входных данных
    - Пропускает тест
    - Измеряет время выполнения теста
    - Запускает тесты параллельно
  answer: 1
  explanation: Так одна тестовая функция проверяет много случаев.
