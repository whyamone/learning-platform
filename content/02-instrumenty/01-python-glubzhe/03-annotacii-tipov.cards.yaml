- front: Что такое аннотация типа?
  back: 'Подсказка о типе параметра или результата: `def area(width: float) -> float:`. Python её не проверяет при выполнении.'

- front: Что такое dataclass?
  back: 'Класс для хранения данных: по списку полей с типами Python сам создаёт конструктор и строковое представление.'

- front: Зачем писать аннотации типов?
  back: Код легче читать, редактор лучше подсказывает, а инструменты вроде `mypy` находят ошибки до запуска.
