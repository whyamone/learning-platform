- question: Чем logging лучше print() для служебных сообщений?
  options:
    - logging не требует импорта
    - Есть уровни важности, время записи и возможность писать в файл
    - print() нельзя использовать в функциях
    - logging работает быстрее
  answer: 2
  explanation: Сообщения можно включать и отключать по уровню, не трогая код.

- question: Какой уровень логирования самый подробный?
  options:
    - WARNING
    - ERROR
    - CRITICAL
    - DEBUG
  answer: 4
  explanation: 'Порядок по возрастанию важности: DEBUG, INFO, WARNING, ERROR, CRITICAL.'

- question: Что описывает файл pyproject.toml?
  options:
    - Список пользователей
    - Содержимое базы данных
    - Сведения о проекте, его зависимости и настройки инструментов
    - Историю изменений проекта
  answer: 3
  explanation: В этом проекте в нём лежат настройки ruff и pytest.
