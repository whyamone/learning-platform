- front: Что такое класс и объект?
  back: Класс — описание того, как устроена сущность. Объект — конкретный экземпляр, созданный по этому описанию.

- front: Что такое атрибут и метод?
  back: Атрибут — данные объекта. Метод — функция, которая принадлежит объекту и работает с его данными.

- front: Что делает метод `__str__`?
  back: Возвращает строку, которой объект представляется при выводе через `print()`.
