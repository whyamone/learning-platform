- front: Назови изменяемые и неизменяемые типы Python.
  back: 'Изменяемые: список, словарь, множество. Неизменяемые: число, строка, кортеж.'

- front: Что такое GIL?
  back: 'Global interpreter lock — блокировка интерпретатора: в каждый момент код Python выполняет один поток.'

- front: Как рассказывать о своём проекте на собеседовании?
  back: Задача, твоя роль, принятые решения и их причины, трудности и результат — за две-три минуты.
