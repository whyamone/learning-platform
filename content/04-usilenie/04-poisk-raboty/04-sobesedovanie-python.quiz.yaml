- question: Чем изменяемые типы отличаются от неизменяемых?
  options:
    - Неизменяемые типы нельзя присваивать переменным
    - Ничем
    - Изменяемые типы хранятся в файлах
    - Изменяемый объект можно менять на месте, неизменяемый — только заменить новым
  answer: 4
  explanation: Список и словарь изменяемы, строка и кортеж — нет.

- question: Что такое GIL?
  options:
    - Блокировка, из-за которой в один момент времени код Python выполняет только один поток
    - Библиотека для графики
    - Формат файлов
    - Менеджер пакетов
  answer: 1
  explanation: Поэтому потоки не ускоряют вычисления, но помогают при операциях ожидания.

- question: Как лучше отвечать на вопрос, ответа на который не знаешь?
  options:
    - Сменить тему
    - Промолчать
    - Придумать уверенный ответ
    - Честно сказать и порассуждать вслух, как бы ты искал ответ
  answer: 4
  explanation: Ход рассуждений показывает больше, чем заученный ответ.
