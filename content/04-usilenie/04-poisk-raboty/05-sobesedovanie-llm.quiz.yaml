- question: С чего начинают ответ на задачу по проектированию системы?
  options:
    - С уточнения требований и ограничений
    - С рисования интерфейса
    - С написания кода
    - С выбора модели
  answer: 1
  explanation: Без понимания нагрузки, данных и ограничений решение будет случайным.

- question: Когда RAG предпочтительнее дообучения?
  options:
    - Когда нужно изменить стиль ответов модели
    - Никогда
    - Когда знания часто меняются и нужны ссылки на источники
    - Когда данных нет вообще
  answer: 3
  explanation: Обновить документы в базе проще, чем заново дообучать модель.

- question: Что отвечать на вопрос «как вы оценивали качество»?
  options:
    - Сказать, что ответы выглядели хорошо
    - Назвать размер модели
    - Сказать, что оценка не требовалась
    - Описать проверочный набор, метрики и сравнение вариантов
  answer: 4
  explanation: Этот вопрос задают почти на каждом собеседовании по LLM.
