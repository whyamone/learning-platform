- front: Назови структуру резюме.
  back: Контакты, краткое описание, навыки, проекты, опыт работы, образование.

- front: Как описать проект в резюме?
  back: Задача, что сделал лично ты, какими средствами и какой получился результат — желательно в цифрах.

- front: Что такое сопроводительное письмо?
  back: 'Короткий текст к отклику: почему тебе интересна именно эта вакансия и чем ты полезен.'
