- question: Как лучше описывать проект в резюме?
  options:
    - Одним словом
    - Перечислением всех использованных библиотек
    - Копией README целиком
    - Через задачу, решение и результат, по возможности с цифрами
  answer: 4
  explanation: Важно показать, что получилось, а не только что использовалось.

- question: Какой объём резюме оптимален для начинающего?
  options:
    - Одна страница
    - Пять страниц
    - Три строки
    - Чем больше, тем лучше
  answer: 1
  explanation: Резюме просматривают за десятки секунд.

- question: Как подать опыт сетевого инженера при переходе в разработку?
  options:
    - 'Как преимущество: знание сетей, Linux, автоматизации и работы в закрытом контуре'
    - Не упоминать вовсе
    - Извиниться за нехватку опыта программирования
    - Указать без подробностей
  answer: 1
  explanation: Многим работодателям нужны разработчики, понимающие инфраструктуру.
