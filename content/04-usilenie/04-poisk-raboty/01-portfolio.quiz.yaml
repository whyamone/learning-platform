- question: Что важнее для портфолио?
  options:
    - Как можно больше репозиториев
    - Проекты без README
    - Копии чужих учебных проектов
    - Несколько законченных проектов с хорошим описанием
  answer: 4
  explanation: Три доведённых до конца проекта говорят больше двадцати заброшенных.

- question: Что читают в репозитории в первую очередь?
  options:
    - Файл лицензии
    - README
    - Список зависимостей
    - Историю коммитов
  answer: 2
  explanation: По README решают, смотреть ли проект дальше.

- question: Чем полезна демонстрация работы в README?
  options:
    - Она увеличивает число коммитов
    - Она ускоряет запуск
    - Она заменяет тесты
    - Проект можно оценить, не запуская его
  answer: 4
  explanation: Изображение или короткое видео экономят время читающего.
