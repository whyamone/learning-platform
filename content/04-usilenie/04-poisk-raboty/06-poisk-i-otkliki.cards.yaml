- front: Что такое воронка откликов?
  back: 'Этапы от отклика до предложения: отклик → приглашение → техническое собеседование → предложение. По ней видно, где ты теряешь шансы.'

- front: Что записывать после каждого собеседования?
  back: Заданные вопросы, темы, в которых были пробелы, и впечатление о компании.

- front: Сколько откликов отправлять?
  back: 'Регулярно и много: поиск первой работы — это десятки откликов, и отказы на этом пути нормальны.'
