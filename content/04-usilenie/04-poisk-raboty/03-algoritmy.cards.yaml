- front: Что означает O(n)?
  back: 'Время работы растёт пропорционально объёму данных: вдвое больше данных — вдвое дольше.'

- front: Чем стек отличается от очереди?
  back: 'Стек: последним пришёл — первым вышел. Очередь: первым пришёл — первым вышел.'

- front: Почему поиск в словаре и множестве быстрый?
  back: 'Они устроены как хеш-таблицы: место элемента вычисляется по его значению, перебор не нужен.'
