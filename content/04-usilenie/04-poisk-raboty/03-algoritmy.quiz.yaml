- question: Что показывает оценка сложности алгоритма?
  options:
    - Как растёт время работы при увеличении объёма данных
    - Сколько памяти установлено в компьютере
    - Насколько трудно читать код
    - Сколько строк в программе
  answer: 1
  explanation: Её записывают в виде O(n), O(n²), O(log n) и так далее.

- question: Какова сложность поиска значения по ключу в словаре Python?
  options:
    - O(n)
    - O(log n)
    - В среднем O(1) — не зависит от размера словаря
    - O(n²)
  answer: 3
  explanation: Словарь устроен как хеш-таблица.

- question: По какому принципу работает стек?
  options:
    - Элементы выходят в случайном порядке
    - Последним пришёл — первым вышел
    - Элементы выходят по алфавиту
    - Первым пришёл — первым вышел
  answer: 2
  explanation: По принципу «первым пришёл — первым вышел» работает очередь.
