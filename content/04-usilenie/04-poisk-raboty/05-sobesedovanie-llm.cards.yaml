- front: Назови порядок ответа на задачу по проектированию.
  back: Уточнить требования → предложить простую схему → найти узкие места → предложить улучшения и способ оценки.

- front: Когда выбрать RAG, а когда дообучение?
  back: RAG — когда нужны актуальные знания и ссылки. Дообучение — когда нужно изменить стиль или формат ответов.

- front: Какие вопросы по LLM задают чаще всего?
  back: Как устроен RAG и где он ошибается, как оценивать качество, как бороться с галлюцинациями, как считать стоимость.
