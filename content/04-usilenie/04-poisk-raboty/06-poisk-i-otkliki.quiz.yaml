- question: Зачем вести учёт откликов?
  options:
    - Чтобы заменить резюме
    - Так требуют работодатели
    - Чтобы видеть, на каком этапе отсеивают, и что стоит улучшить
    - Чтобы увеличить число откликов
  answer: 3
  explanation: Если нет приглашений — дело в резюме, если отсеивают после беседы — в подготовке.

- question: Что делать после неудачного собеседования?
  options:
    - Ничего
    - Прекратить поиск
    - Удалить резюме
    - Записать вопросы, на которых запнулся, и разобрать их
  answer: 4
  explanation: Каждое собеседование — источник тем для повторения.

- question: Что повышает шанс получить приглашение?
  options:
    - Отклик без резюме
    - Отклик, приспособленный под конкретную вакансию
    - Резюме на десять страниц
    - Одинаковое письмо для всех вакансий
  answer: 2
  explanation: Адресное письмо показывает, что ты прочитал описание вакансии.
