- question: Что такое квантизация?
  options:
    - Увеличение контекстного окна
    - Перевод модели на другой язык
    - Обучение модели на новых данных
    - Сжатие модели за счёт снижения точности чисел в весах
  answer: 4
  explanation: Модель занимает меньше памяти ценой небольшой потери качества.

- question: Что обычно означает больший размер модели в параметрах?
  options:
    - Меньше требования к памяти
    - Модель всегда работает быстрее
    - Выше качество, но больше требования к памяти и ниже скорость
    - Ниже качество
  answer: 3
  explanation: Выбор модели — компромисс между качеством, скоростью и памятью.

- question: Как выбрать степень квантизации под свою задачу?
  options:
    - Всегда брать самое сильное сжатие
    - Всегда брать модель без сжатия
    - Выбрать случайно
    - Сравнить варианты на своём проверочном наборе
  answer: 4
  explanation: Потеря качества зависит от задачи, поэтому её измеряют.
