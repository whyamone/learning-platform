- question: Что такое инференс?
  options:
    - Работа готовой модели — получение ответов на запросы
    - Сжатие модели
    - Скачивание модели
    - Обучение модели
  answer: 1
  explanation: Обучение создаёт модель, инференс её использует.

- question: Зачем запускать модель локально?
  options:
    - Так модель обучается быстрее
    - Локальные модели всегда умнее облачных
    - Локальной модели не нужна память
    - Данные не покидают твой компьютер, и не нужно платить за каждый запрос
  answer: 4
  explanation: Это важно там, где данные нельзя отправлять наружу.

- question: Что определяет, какую модель удастся запустить на видеокарте?
  options:
    - Объём видеопамяти
    - Версия браузера
    - Скорость интернета
    - Диагональ монитора
  answer: 1
  explanation: Модель должна поместиться в видеопамять, иначе работа сильно замедлится.
