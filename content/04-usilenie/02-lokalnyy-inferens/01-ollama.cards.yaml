- front: Что такое Ollama?
  back: Программа для запуска языковых моделей на своём компьютере. Предоставляет API, совместимый с OpenAI.

- front: Что такое VRAM?
  back: Видеопамять — память видеокарты. От её объёма зависит, какая модель поместится.

- front: Что такое Modelfile?
  back: 'Файл настроек модели в Ollama: базовая модель, системный промпт, параметры генерации.'
