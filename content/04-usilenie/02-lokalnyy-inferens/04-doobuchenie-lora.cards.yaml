- front: Что такое дообучение?
  back: Продолжение обучения готовой модели на своих примерах, чтобы приспособить её к конкретной задаче.

- front: Что такое LoRA?
  back: 'Low-rank adaptation: способ дообучения, при котором обучается небольшая надстройка (адаптер), а исходные веса остаются прежними.'

- front: В каком порядке пробовать способы улучшения ответов?
  back: Промпт → примеры в промпте → RAG → дообучение.
