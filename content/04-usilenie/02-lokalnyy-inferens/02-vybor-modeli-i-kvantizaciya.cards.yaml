- front: Что такое квантизация?
  back: 'Сжатие модели: веса хранятся с меньшей точностью, модель занимает меньше памяти и почти не теряет в качестве.'

- front: Что такое GGUF?
  back: Формат файлов моделей для локального запуска, в том числе в сжатом виде.

- front: Между чем приходится выбирать при подборе локальной модели?
  back: Между качеством ответов, скоростью генерации и объёмом занимаемой памяти.
