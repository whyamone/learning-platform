- front: Что такое vLLM?
  back: 'Сервер инференса, рассчитанный на высокую нагрузку: много одновременных запросов к одной модели.'

- front: Что такое пакетная обработка запросов?
  back: Объединение нескольких запросов для одновременной обработки на видеокарте — так растёт пропускная способность.

- front: Чем отличаются задержка и пропускная способность?
  back: Задержка — время ответа на один запрос. Пропускная способность — сколько запросов обрабатывается в единицу времени.
