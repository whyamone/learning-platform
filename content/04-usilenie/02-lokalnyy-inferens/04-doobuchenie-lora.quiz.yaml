- question: Что пробуют в первую очередь, когда модель плохо справляется с задачей?
  options:
    - Сразу дообучают модель
    - Улучшают промпт, затем добавляют RAG, и только потом думают о дообучении
    - Покупают более мощную видеокарту
    - Меняют язык программирования
  answer: 2
  explanation: Дообучение — самый дорогой и долгий путь.

- question: В чём идея LoRA?
  options:
    - Модель обучается с нуля
    - Обучается небольшая надстройка, а веса исходной модели не меняются
    - Модель сжимается в десять раз
    - Модель переводится на другой язык
  answer: 2
  explanation: Поэтому дообучение возможно на обычной видеокарте.

- question: Что нужно для дообучения в первую очередь?
  options:
    - Быстрый интернет
    - Много системных промптов
    - Качественный набор примеров «вход — желаемый ответ»
    - Самая большая модель
  answer: 3
  explanation: Качество дообучения определяется качеством примеров.
