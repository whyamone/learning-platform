- question: Для чего предназначен vLLM?
  options:
    - Для написания промптов
    - Для обучения моделей с нуля
    - Для обслуживания многих одновременных запросов к модели с высокой пропускной способностью
    - Для хранения векторов
  answer: 3
  explanation: Он объединяет запросы в пакеты и эффективно использует видеокарту.

- question: Что такое пропускная способность сервера моделей?
  options:
    - Число установленных моделей
    - Длина контекстного окна
    - Сколько токенов или запросов он обрабатывает в единицу времени
    - Размер модели на диске
  answer: 3
  explanation: Её измеряют под нагрузкой от нескольких одновременных клиентов.

- question: Когда достаточно Ollama, а когда нужен vLLM?
  options:
    - Разницы нет
    - Ollama — для одного пользователя и разработки, vLLM — для сервиса с множеством запросов
    - vLLM — только для Windows
    - Ollama — для больших моделей, vLLM — для маленьких
  answer: 2
  explanation: Инструмент выбирают по нагрузке.
