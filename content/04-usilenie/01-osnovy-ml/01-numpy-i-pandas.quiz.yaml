- question: Что такое DataFrame в pandas?
  options:
    - График
    - Одномерный массив чисел
    - Файл формата CSV
    - Таблица со строками и именованными столбцами
  answer: 4
  explanation: Отдельный столбец таблицы называется Series.

- question: Почему в NumPy и pandas избегают циклов по элементам?
  options:
    - Операции над целым массивом выполняются во много раз быстрее
    - Циклы дают неверный результат
    - Циклы в этих библиотеках запрещены
    - Так требует формат CSV
  answer: 1
  explanation: Векторные операции выполняются оптимизированным кодом, а не интерпретатором Python.

- question: Что делает метод groupby?
  options:
    - Объединяет две таблицы
    - Удаляет пропуски
    - Сортирует таблицу
    - Разбивает строки на группы по значению столбца для подсчёта итогов
  answer: 4
  explanation: Это аналог GROUP BY из SQL.
