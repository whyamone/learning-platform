- front: Что такое вес в нейросети?
  back: Настраиваемое число внутри модели. При обучении веса подбираются так, чтобы ошибка уменьшалась.

- front: Что такое трансформер?
  back: Архитектура нейросети, основанная на механизме внимания. На ней построены современные языковые модели.

- front: Что такое механизм внимания?
  back: Способ учитывать связи между всеми словами текста при обработке каждого из них.
