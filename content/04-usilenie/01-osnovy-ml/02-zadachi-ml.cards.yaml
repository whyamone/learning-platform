- front: Что такое обучение с учителем?
  back: Обучение на примерах, где для каждого входа известен правильный ответ.

- front: Что такое признак и метка?
  back: Признак — входная характеристика объекта. Метка — правильный ответ, который нужно предсказать.

- front: Когда доля верных ответов вводит в заблуждение?
  back: 'Когда классы неравны по размеру: если аварий 1%, модель «аварий нет» верна в 99% случаев и при этом бесполезна.'
