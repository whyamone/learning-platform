- question: Что делает метод fit?
  options:
    - Делает предсказание
    - Рисует график
    - Обучает модель на данных
    - Сохраняет модель на диск
  answer: 3
  explanation: Предсказание делает метод predict.

- question: Что даёт перекрёстная проверка?
  options:
    - Более надёжную оценку качества за счёт нескольких разбиений данных
    - Автоматическое исправление ошибок в данных
    - Ускорение обучения
    - Уменьшение числа признаков
  answer: 1
  explanation: Модель обучают и проверяют несколько раз на разных частях данных.

- question: Что такое случайный лес?
  options:
    - Случайный набор данных
    - Ансамбль из многих деревьев решений, ответы которых усредняются
    - Способ разбиения на выборки
    - Метрика качества
  answer: 2
  explanation: Объединение многих простых моделей обычно точнее одной.
