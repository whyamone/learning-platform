- question: Что происходит при обучении нейросети?
  options:
    - Увеличивается число слоёв
    - В сеть записываются готовые ответы
    - Подбираются веса, при которых ошибка на примерах становится меньше
    - Сеть копирует данные из интернета
  answer: 3
  explanation: Веса понемногу изменяются в сторону уменьшения ошибки.

- question: Что делает механизм внимания?
  options:
    - Сжимает текст
    - Переводит текст на другой язык
    - Ускоряет загрузку модели
    - Позволяет модели учитывать связи между всеми словами текста
  answer: 4
  explanation: Благодаря ему слово понимается с учётом остального контекста.

- question: Чем дообучение отличается от предобучения?
  options:
    - Предобучение выполняется после дообучения
    - Дообучение всегда требует больше данных
    - Ничем
    - Предобучение идёт на огромном объёме общих данных, дообучение — на небольшом наборе под задачу
  answer: 4
  explanation: Готовую модель дообучают, чтобы приспособить к конкретной задаче.
