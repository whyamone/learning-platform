- front: Что делают `fit` и `predict`?
  back: '`fit` обучает модель на данных, `predict` делает предсказание для новых объектов.'

- front: Что такое перекрёстная проверка?
  back: 'Оценка качества на нескольких разбиениях: данные делят на части, и каждая по очереди служит тестовой.'

- front: Что такое гиперпараметр?
  back: Настройка модели, которую задают до обучения, например глубина дерева.
