- front: Что такое NumPy и pandas?
  back: NumPy — библиотека для числовых массивов. pandas — библиотека для таблиц, построенная поверх NumPy.

- front: Что такое векторная операция?
  back: 'Действие сразу над всем массивом или столбцом без цикла: `prices * 2`.'

- front: Что делать с пропущенными значениями?
  back: Найти их, а затем осознанно удалить строки или заполнить значением — в зависимости от задачи.
