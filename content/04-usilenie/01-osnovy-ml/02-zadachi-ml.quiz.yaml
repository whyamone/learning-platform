- question: Чем классификация отличается от регрессии?
  options:
    - Регрессия предсказывает категорию, классификация — число
    - Классификация работает только с текстом
    - Ничем
    - Классификация предсказывает категорию, регрессия — число
  answer: 4
  explanation: «Авария или нет» — классификация. «Сколько мегабит будет завтра» — регрессия.

- question: Зачем данные делят на обучающую и тестовую выборки?
  options:
    - Чтобы обучение шло быстрее
    - Чтобы удалить ошибки в данных
    - Чтобы уменьшить размер файла
    - Чтобы проверить модель на примерах, которых она не видела
  answer: 4
  explanation: Оценка на обучающих данных не показывает, как модель поведёт себя на новых.

- question: Что такое переобучение?
  options:
    - Модель запомнила обучающие примеры, но плохо работает на новых данных
    - Модель обучалась слишком мало
    - Модель слишком мала
    - Модель обучена дважды
  answer: 1
  explanation: 'Признак: высокое качество на обучающих данных и низкое на тестовых.'
