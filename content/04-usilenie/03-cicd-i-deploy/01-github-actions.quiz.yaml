- question: Что такое непрерывная интеграция?
  options:
    - Ежедневное резервное копирование
    - Автоматический запуск проверок при каждом изменении кода
    - Объединение всех файлов в один
    - Постоянное подключение к интернету
  answer: 2
  explanation: Ошибка находится сразу, а не через неделю.

- question: Где хранить ключи и пароли для рабочих процессов GitHub Actions?
  options:
    - В секретах репозитория
    - В названии ветки
    - В README
    - В файле рабочего процесса
  answer: 1
  explanation: Секреты недоступны для чтения и скрываются в журналах.

- question: Что запускает рабочий процесс?
  options:
    - Перезагрузка компьютера разработчика
    - Открытие сайта GitHub в браузере
    - Только ручной запуск
    - Событие, например отправка коммита или открытие pull request
  answer: 4
  explanation: События перечисляют в разделе on файла рабочего процесса.
