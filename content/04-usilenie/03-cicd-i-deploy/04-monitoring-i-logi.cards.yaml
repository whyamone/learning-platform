- front: Что такое мониторинг?
  back: 'Постоянное наблюдение за работой системы: доступность, время ответа, загрузка, ошибки.'

- front: Что такое оповещение?
  back: 'Автоматическое сообщение о проблеме: сервис недоступен, диск заполнен, ошибок стало много.'

- front: Что такое uptime?
  back: Доля времени, в течение которого сервис был доступен.
