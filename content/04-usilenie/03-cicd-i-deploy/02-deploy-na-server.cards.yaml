- front: Что такое деплой?
  back: 'Развёртывание: доставка приложения на сервер и его запуск в рабочей среде.'

- front: Что такое VPS?
  back: Виртуальный выделенный сервер — арендованная виртуальная машина с доступом по SSH.

- front: Назови первые шаги защиты сервера.
  back: Обычный пользователь вместо root, вход только по ключу, межсетевой экран, обновления.
