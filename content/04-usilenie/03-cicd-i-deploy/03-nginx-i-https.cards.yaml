- front: Что такое обратный прокси?
  back: 'Сервер, который стоит перед приложением: принимает запросы, занимается шифрованием и передаёт их дальше.'

- front: Что такое сертификат TLS?
  back: Документ, подтверждающий, что сервер действительно принадлежит домену. Нужен для HTTPS.

- front: Почему приложение не открывают в интернет напрямую?
  back: Обратный прокси берёт на себя шифрование, ограничения и раздачу файлов, а приложение слушает только локальный адрес.
