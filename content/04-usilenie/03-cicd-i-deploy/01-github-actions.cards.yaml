- front: Что такое CI?
  back: 'Continuous integration — непрерывная интеграция: тесты и линтер запускаются автоматически при каждом изменении.'

- front: Что такое рабочий процесс в GitHub Actions?
  back: Файл YAML в папке `.github/workflows` с описанием событий запуска и шагов.

- front: Зачем нужны проверки в pull request?
  back: Чтобы в основную ветку не попал код, который не проходит тесты.
