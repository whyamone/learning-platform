- question: Что делают на новом сервере в первую очередь?
  options:
    - Устанавливают графический интерфейс
    - Создают обычного пользователя, настраивают вход по ключу и межсетевой экран
    - Отключают обновления
    - Разрешают вход под root по паролю
  answer: 2
  explanation: Сервер в интернете начинают атаковать через минуты после включения.

- question: Что обеспечивает настройка restart в Docker Compose?
  options:
    - Обновление образа
    - Автоматический запуск контейнера после сбоя или перезагрузки сервера
    - Шифрование трафика
    - Резервное копирование
  answer: 2
  explanation: Без неё после перезагрузки приложение останется выключенным.

- question: Что такое откат?
  options:
    - Возврат к предыдущей рабочей версии
    - Перезагрузка базы данных
    - Удаление сервера
    - Обновление зависимостей
  answer: 1
  explanation: Возможность быстро откатиться важнее безошибочности.
