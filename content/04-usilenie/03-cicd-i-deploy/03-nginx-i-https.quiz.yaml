- question: Что делает обратный прокси?
  options:
    - Шифрует жёсткий диск
    - Хранит резервные копии
    - Принимает запросы из интернета и передаёт их приложению
    - Заменяет базу данных
  answer: 3
  explanation: Он же обычно отвечает за шифрование и раздачу статических файлов.

- question: Что даёт HTTPS?
  options:
    - Шифрование трафика между браузером и сервером
    - Ускорение сайта
    - Защиту от ошибок в коде
    - Увеличение памяти сервера
  answer: 1
  explanation: Без него данные передаются открыто и могут быть прочитаны по пути.

- question: Какая запись DNS связывает доменное имя с IP-адресом сервера?
  options:
    - NS
    - A
    - TXT
    - MX
  answer: 2
  explanation: Запись A указывает адрес IPv4. MX относится к почте.
