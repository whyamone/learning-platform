- question: Зачем нужен мониторинг?
  options:
    - Чтобы ускорить приложение
    - Чтобы узнать о проблеме раньше пользователей
    - Чтобы уменьшить размер образа
    - Чтобы заменить тесты
  answer: 2
  explanation: Оповещение о сбое должно приходить автоматически.

- question: Что проверяет адрес /health?
  options:
    - Скорость интернета у пользователя
    - Что приложение запущено и его зависимости доступны
    - Количество пользователей
    - Правильность ответов модели
  answer: 2
  explanation: Его регулярно опрашивают системы мониторинга и оркестрации.

- question: Чем показатели отличаются от журналов?
  options:
    - Журналы — числа, показатели — текст
    - Ничем
    - Показатели — числа во времени, журналы — записи об отдельных событиях
    - Показатели хранятся только на бумаге
  answer: 3
  explanation: Показатели отвечают на вопрос «сколько», журналы — «что именно произошло».
